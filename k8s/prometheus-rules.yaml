# PrometheusRule for prometheus-operator (monitoring.coreos.com/v1).
# Apply to the namespace where your Prometheus instance is configured to discover rules
# (often "monitoring"). If you do not use the operator, extract the inner "groups" YAML
# into a Prometheus file_sd / prometheus.yml rule_file instead.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: instant-platform
  namespace: instant
  labels:
    release: prometheus
    role: alert-rules
spec:
  groups:
    - name: instant-api
      rules:
        - alert: HighProvisionErrorRate
          expr: |
            (
              sum(rate(instant_http_errors_total{route=~"/db/new|/cache/new|/nosql/new|/queue/new|/storage/new",status_class="5xx"}[5m]))
            )
            /
            clamp_min(
              sum(rate(instant_http_request_duration_seconds_count{route=~"/db/new|/cache/new|/nosql/new|/queue/new|/storage/new"}[5m])),
              1e-9
            )
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Provision 5xx error rate > 5% (instant_http_errors_total / request count)"

        - alert: HighProvisionLatency
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(instant_http_request_duration_seconds_bucket{route=~"/db/new|/cache/new|/nosql/new|/queue/new|/storage/new"}[5m])
              )
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 provision latency > 5s (instant_http_request_duration_seconds)"

        - alert: ResourceCountCapBlocked
          # Task #55: per-service resource-COUNT cap rejections. INERT until an
          # operator sets RESOURCE_COUNT_CAPS_ENABLED (default off), so this rule
          # stays quiet until enforcement is enabled. P2 (abuse/observability):
          # a sustained block rate after enable is either a tenant hammering a
          # cap (upsell/abuse signal) or a too-low cap (revisit plans.yaml).
          # Lazy CounterVec — the {service,team_tier} series only appears after
          # the first block.
          expr: |
            sum by (service, team_tier) (
              rate(instant_resource_count_limit_blocked_total[1h])
            ) * 3600 > 20
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Resource-count cap blocking > 20 provisions/h for a tier+service (instant_resource_count_limit_blocked_total)"

        - alert: APIDown
          expr: up{job="instant-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "instant-api scrape target is down"

        - alert: ProvisionerGRPCDown
          expr: up{job="instant-provisioner"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "instant-provisioner scrape target is down"

        - alert: HighClaimFailureRate
          expr: |
            (
              sum(rate(instant_http_errors_total{route="/claim",status_class=~"4xx|5xx"}[10m]))
            )
            /
            clamp_min(sum(rate(instant_http_request_duration_seconds_count{route="/claim"}[10m])), 1e-9)
            > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Claim route 4xx/5xx rate > 10%"

        - alert: AnonymousResourceExpiryStopped
          expr: |
            increase(instant_expired_resources_total[1h]) == 0
            and instant_active_anonymous_resources > 100
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "No anonymous expirations in 1h while many active TTL resources remain (worker metrics)"

        # Storage IAM user creation failures in the /storage/new hot path.
        # A failure here blocks a paying customer's signup-to-first-byte flow.
        # Counter source: api/internal/handlers/storage.go (instant_storage_iam_users_failed_total,
        # labelled op=create|delete). This is the guaranteed-working equivalent of the
        # New Relic storage-iam-create-failed alert, which depends on the NR Prometheus
        # OpenMetrics integration being configured.
        - alert: StorageIamCreateFailures
          expr: increase(instant_storage_iam_users_failed_total{op="create"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Storage IAM user create failures > 0 in 5m (signup-blocking)"

        # NATS credential issuance failures — the queueprovider abstraction
        # could not mint an isolated per-tenant account JWT for a /queue/new
        # call. MR-P0-5 (NATS per-tenant isolation, 2026-05-20). Each failure
        # means that tenant landed in legacy_open mode = no isolation =
        # shares the unauthenticated NATS namespace with everyone else.
        # Counter source: api/internal/handlers/queue.go (queue.cred_issue_failed
        # → metrics.NatsAuthFailures.Inc()). Common cause: operator seed in
        # the nats-operator Secret is out of sync with the running
        # nats-server's operator JWT.
        - alert: NATSAuthFailures
          expr: increase(nats_auth_failures_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            service: queue
          annotations:
            summary: "NATS auth failures > 0 in 5m — tenants landing in legacy_open (no isolation)"
            description: "{{ $value }} NATS credential-issuance failures in 5m. Each failure = one tenant /queue/new that fell back to unauthenticated NATS. Check operator seed in nats-operator Secret matches running nats-server."

        # ─────────────────────────────────────────────────────────────────────
        # Tier-upgrade deployment-TTL promote failures (P1 fix, 2026-05-31).
        # Source: api emits `instant_tier_upgrade_ttl_promote_total{outcome=…}`
        # from billing.handleSubscriptionCharged after every paid-tier
        # upgrade. outcome="error" means the promote tx errored — the upgrade
        # itself still committed, but the team's deployment-TTL state may
        # still carry 'auto_24h' until the operator runs
        # `cmd/backfill-tier-ttl -apply` (idempotent). A single failure pages
        # because it corresponds to a real paying customer whose deploys may
        # auto-expire.
        - alert: TierUpgradeTTLPromoteFailed
          expr: increase(instant_tier_upgrade_ttl_promote_total{outcome="error"}[10m]) > 0
          for: 0m
          labels:
            severity: critical
            service: billing
          annotations:
            summary: "Tier-upgrade TTL-promote errored — paid team's deploys may still auto-expire (P1)"
            description: "{{ $value }} promote failures in 10m. The Razorpay subscription.charged webhook upgraded the team but PromoteDeploymentTTLsForTeam errored — teams.default_deployment_ttl_policy and pre-upgrade auto_24h deploys may still be stale. Run `kubectl exec -n instant deploy/instant-api -- /app/backfill-tier-ttl -apply` (or from a checkout: `go run ./cmd/backfill-tier-ttl -apply`) to repair. The script is idempotent."

    # =========================================================================
    # Nightly backup CronJobs — postgres-customers / mongodb / redis-provision
    # =========================================================================
    # Source: kube-state-metrics emits `kube_cronjob_status_last_successful_time`
    # (unix seconds of last successful Job run). Compare against `time()` and
    # alert when the gap exceeds 36h (=1 missed night) or 60h (=2 missed nights).
    # These rules activate only when kube-state-metrics is scraped — until then
    # the New Relic log-based alert (newrelic/alerts/backup-stale-36h.json) is
    # the authoritative coverage. Drill: bash infra/scripts/restore-drill.sh.
    # Runbook: infra/BACKUP-RESTORE-RUNBOOK.md.
    - name: instant-backups
      rules:
        - alert: BackupCronJobStale36h
          expr: |
            time() - max by (cronjob) (
              kube_cronjob_status_last_successful_time{
                namespace="instant-data",
                cronjob=~"postgres-customers-backup|mongodb-backup|redis-provision-backup"
              }
            ) > 129600
          for: 30m
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "Backup CronJob {{ $labels.cronjob }} has no successful run in >36h (one missed night)"
            description: "Last successful run of {{ $labels.cronjob }} was {{ humanizeDuration $value }} ago. Schedule is 03:00 UTC daily; >36h gap = at least one missed night. See infra/BACKUP-RESTORE-RUNBOOK.md."

        - alert: BackupCronJobStale60h
          expr: |
            time() - max by (cronjob) (
              kube_cronjob_status_last_successful_time{
                namespace="instant-data",
                cronjob=~"postgres-customers-backup|mongodb-backup|redis-provision-backup"
              }
            ) > 216000
          for: 30m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "Backup CronJob {{ $labels.cronjob }} has no successful run in >60h (two missed nights) — durability incident"
            description: "Last successful run of {{ $labels.cronjob }} was {{ humanizeDuration $value }} ago. Two consecutive missed nights = the Pro-tier backup promise is now broken for any data written since the last good backup. Follow infra/BACKUP-RESTORE-RUNBOOK.md."

        - alert: BackupCronJobFailedLastRun
          expr: |
            max by (cronjob) (kube_job_status_failed{namespace="instant-data",job_name=~"(postgres-customers-backup|mongodb-backup|redis-provision-backup)-.*"}) > 0
          for: 15m
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "Backup Job {{ $labels.cronjob }} most recent run is in Failed state"
            description: "kube_job_status_failed > 0 for backup Job in instant-data. Pull pod logs and re-run manually if needed: see infra/BACKUP-RESTORE-RUNBOOK.md."

        # Per-tenant (customer) backup runner — worker metric, distinct from the
        # CronJob alerts above. instant_customer_backup_failed_total{reason}.
        # A clean failure here previously paged no one (stale=36h, no-followup=
        # stuck-only). reason="auth" = credential drift: SLA breach, won't
        # self-heal → CRITICAL. Any other reason → WARNING.
        - alert: CustomerBackupCredentialFailure
          expr: |
            increase(instant_customer_backup_failed_total{reason="auth"}[15m]) > 0
          for: 0m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "Customer backup failing with credential/auth error (stored connection_url drifted from the live DB role)"
            description: "A per-tenant backup's pg_dump was rejected by the customer Postgres (password auth failed / role missing). This won't self-heal — every scheduled backup for that resource keeps failing, breaking the paid-tier durability promise. Find it: worker log jobs.customer_backup_runner.failed reason=auth (carries backup_id + raw stderr). Re-sync the credential per infra/BACKUP-RESTORE-RUNBOOK.md. NR: newrelic/alerts/customer-backup-failed.json."

        - alert: CustomerBackupFailures
          expr: |
            increase(instant_customer_backup_failed_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "Customer backup runs failing ({{ $labels.reason }})"
            description: "One or more per-tenant backup runs failed in the last hour. reason label distinguishes auth (credential drift, see the CRITICAL companion) from transient dump/upload failures (retried next run). Success ratio tile on the customer-visible-backup-health dashboard."

    # instant-worker — propagation_runner dead-letter alerts (CHAOS F3, 2026-05-20).
    # Fires on the worker's instant_propagation_dead_lettered_total counter
    # (introduced in worker repo, see metrics.go::PropagationDeadLetteredTotal).
    # Three triggers feed this metric — labelled by `reason`:
    #   reason="max_attempts" — propagationMaxAttempts (10) of exponential
    #                           backoff retries exhausted (the modal real-failure
    #                           path: provisioner gRPC down, F1's
    #                           unexpected_skip-as-failure, markApplied DB blip).
    #   reason="unknown_kind" — CHAOS F2: old worker image saw a kind the api
    #                           started enqueuing in a newer release.
    # Both mean a paying customer's regrade fell through. The companion NR
    # log-based alert (newrelic/alerts/propagation-dead-lettered.json) keys on
    # the slog ERROR line; this Prom rule keys on the counter for the case
    # where NR Log ingest is brown-outed but Prometheus is still scraping.
    - name: instant-worker
      rules:
        - alert: PropagationDeadLettered
          expr: |
            sum(rate(instant_propagation_dead_lettered_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "instant-worker propagation_runner dead-lettered a row in the last 5m (Pro-on-paper, hobby-grade infra)"
            description: "instant_propagation_dead_lettered_total > 0 for >5m. propagation_runner is the last line of defence between Razorpay webhook delivery and customer infra; any dead-letter means a paying customer's regrade fell through. Inspect pending_propagations.last_error + the team's resources, fix the underlying issue, then either DELETE the row to let entitlement_reconciler converge OR reset failed_at=NULL+attempts=0 to re-arm the runner. See CHAOS-DRILL-2026-05-20.md F1/F2/F3."

        # Per-tick image-skew leading indicator: PropagationUnknownKindTotal
        # fires on EVERY tick while an unknown-kind row is alive (not just
        # at the eventual dead-letter, which is ~24h away on the default
        # backoff). Lets the operator catch a half-rolled-out worker pod
        # within seconds rather than waiting the full backoff exhaustion.
        # Lower-severity than PropagationDeadLettered — the fix here is to
        # finish the rollout, NOT to wake on-call.
        - alert: PropagationUnknownKind
          expr: |
            sum by (kind) (rate(instant_propagation_unknown_kind_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "instant-worker saw a pending_propagations kind it doesn't recognise (kind={{ $labels.kind }})"
            description: "instant_propagation_unknown_kind_total{kind=\"{{ $labels.kind }}\"} > 0 for >5m. A worker pod is running an older image than the api enqueued (kind={{ $labels.kind }} is not in propagationHandlers). Finish the rollout — `kubectl rollout status deploy/instant-worker -n instant-infra` and confirm pods are on the same image as instant-api. The row will dead-letter after propagationMaxAttempts (10) attempts (~24h cumulative backoff) which will fire PropagationDeadLettered above; this is the early warning."

    # instant-worker — orphan_sweep PASS 3/4/5/6 reap alerts (2026-05-20).
    # Fires on the worker's instant_orphan_sweep_reaped_total counter
    # (introduced in worker repo, see metrics.go::OrphanSweepReapedTotal).
    # Each reap is labelled by `reason`; the alerts here key on the
    # reasons that imply a distinct upstream bug worth paging on.
    - name: instant-worker-orphan-sweep
      rules:
        - alert: OrphanSweepNoDBRowReap
          expr: |
            sum(rate(instant_orphan_sweep_reaped_total{reason="no_db_row"}[1h])) > 0
          for: 1h
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "orphan_sweep reaped an instant-deploy-* namespace with NO backing deployments row (P0-3 atomic-provision bug)"
            description: |
              instant_orphan_sweep_reaped_total{reason="no_db_row"} > 0 for >1h.
              A no_db_row event means a k8s namespace was provisioned (instant-deploy-<appID>)
              but no deployments row exists for that app_id — the api created the namespace
              but the INSERT into deployments never landed. This is the P0-3 atomic-provision
              symptom surfacing in prod.
              Investigate same hour: search NR Logs for `jobs.orphan_sweep.proposed_reap`
              with reason=no_db_row, capture the app_id, then trace back through the api
              POST /deploy/new logs for the same time window to find the partial-commit
              path that needs the atomic-rollback fix.

        - alert: OrphanSweepStuckBuildSpike
          expr: |
            sum(rate(instant_orphan_sweep_reaped_total{reason="failed_build"}[15m])) * 900 > 5
          for: 15m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "orphan_sweep PASS 6 flipped >5 stuck builds to failed in 15m (build pipeline degraded)"
            description: |
              instant_orphan_sweep_reaped_total{reason="failed_build"} > 5 events in 15m.
              PASS 6 catches deployments stuck in 'building'/'deploying' for >30min whose
              pod is in ImagePullBackOff/ErrImagePull/CrashLoopBackOff. A burst means many
              customers' builds are wedged at once — the most likely cause is a ghcr.io
              outage, a Kaniko image-push 403 (worker-rbac.yaml GHCR_PUSH_TOKEN scope), or
              an upstream registry auth failure. Check ghcr.io status, the deploy.yml CI
              push step, and the kaniko build pod logs in instant-deploy-* namespaces.

        - alert: OrphanSweepReapFailureRate
          expr: |
            sum(rate(instant_orphan_sweep_reap_failed_total[15m])) by (reason) > 0
          for: 30m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "orphan_sweep reap_failed > 0 sustained for 30m (reason={{ $labels.reason }})"
            description: |
              instant_orphan_sweep_reap_failed_total{reason="{{ $labels.reason }}"} > 0
              sustained for >30 minutes. The reconciler detected an orphan but could not
              clean it — a k8s API outage or a DB write failure. Single transient events
              are fine; a sustained rate means the reap path itself is broken. Check
              instant-worker pod logs for `jobs.orphan_sweep.*_delete_failed` lines.

    # instant-worker — audit-only orphan-DB / redis-namespace sweep (2026-06-09).
    # DISTINCT from the namespace orphan_sweep above: orphan_db_sweep (worker
    # internal/jobs/orphan_db_sweep.go) is a DETECTION/DRY-RUN surface for the
    # ~25-orphan customer-DB drain backlog. Flag-gated OFF (ORPHAN_DB_SWEEP_ENABLED);
    # when on it only LOGS + counts candidates (no drop — the destructive arm is a
    # SECOND flag that routes through the audited provisioner chokepoint, never a raw
    # DROP; truehomie safety). The gauge stays 0 while the flag is off. These alerts
    # surface the backlog so an operator reviews the candidate list before any
    # destructive enablement. Metrics: instant_orphan_db_sweep_candidates_{total,current}{kind}.
    - name: instant-worker-orphan-db-sweep
      rules:
        - alert: OrphanDBSweepBacklog
          # Sustained backlog → orphaned customer DBs / instant-customer-* redis
          # namespaces (no active resource row) accumulating faster than they drain.
          # P2 capacity hygiene, not an outage. Only fires once the sweep flag is on
          # (gauge is 0 when off). kind ∈ {customer_namespace, redis_namespace}.
          expr: |
            max(instant_orphan_db_sweep_candidates_current) by (kind) > 25
          for: 1h
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "orphan-DB sweep backlog > 25 (kind={{ $labels.kind }}) — review candidates before destructive enablement"
            description: |
              instant_orphan_db_sweep_candidates_current{kind="{{ $labels.kind }}"} > 25 for >1h.
              The audit-only orphan_db_sweep is detecting orphaned customer DBs / instant-customer-*
              redis namespaces faster than they drain — the drain backlog the sweep was built to
              surface. Review the candidate list in NR Logs (jobs.orphan_db_sweep.candidate); once
              verified, an operator may enable the AUDITED destructive arm
              (ORPHAN_DB_SWEEP_DESTRUCTIVE_ENABLED), which reclaims via the provisioner chokepoint.
              NEVER drop a customer DB manually (truehomie incident, 2026-06-03).

    # instant-* — code-defect signals (BugBash 2026-05-20).
    # Both counters are incremented by the safego.Go wrapper's deferred
    # recover() when a panic would otherwise crash a background goroutine.
    # Recovered panics keep the pod up, but they ALMOST ALWAYS indicate a
    # real code defect that escaped the test suite. Page on any occurrence.
    - name: instant-code-defects
      rules:
        - alert: GoroutinePanicsRecovered
          expr: |
            sum(rate(instant_goroutine_panics_total[5m]))
              + sum(rate(instant_worker_goroutine_panics_recovered_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: platform
          annotations:
            summary: "instant-* recovered a goroutine panic — code defect shipped to prod"
            description: |
              instant_goroutine_panics_total (api) + instant_worker_goroutine_panics_recovered_total (worker)
              > 0 for >5m. Some goroutine panicked and the safego.Go wrapper caught it. The
              pod stayed up, but the panic almost certainly indicates a missed error path or
              nil-deref shipped past the test gates. Grep NR Logs for `safego.panic_recovered`
              within the same time window to find the stack trace; fix the root cause and ship.

    # instant-worker — entitlement_regrade_failed > 0 (BugBash 2026-05-20).
    # The entitlement_reconciler job calls provisioner.RegradeResource() to
    # raise a tier-drifted resource's backend limits to the team's current
    # plan tier. A failure here = a paying customer is still on lower-tier
    # backend limits despite paying for the higher tier. Pair with the
    # billing-charge-undeliverable alert (inverse failure mode: tier-not-
    # translated-to-DB).
    - name: instant-worker-entitlements
      rules:
        - alert: EntitlementRegradeFailed
          expr: |
            sum by (service) (rate(instant_entitlement_regrade_failed_total[10m])) > 0
          for: 10m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "entitlement_regrade_failed > 0 — paying customer on wrong tier limits"
            description: |
              instant_entitlement_regrade_failed_total > 0 for >10m. The entitlement_reconciler
              failed to call provisioner.RegradeResource() to raise a resource's backend limits
              to match the team's current paid tier. A paying customer is getting lower-tier
              infrastructure. Grep worker logs for `jobs.entitlement_reconciler.regrade_failed`;
              pair with billing-charge-undeliverable (inverse: tier not translated to DB at all).

    # CHAOS F1 (2026-05-20) — propagation_runner used to silently mark APPLIED on
    # any row whose target resource was missing/in an unexpected state. The fix
    # added unexpected_skip counting AND treats those rows as Failure (counts
    # against maxAttempts). This rule pages if the counter ticks more than once
    # — every unexpected_skip is one class of customer-facing nondeterminism
    # that the operator should investigate, not just the eventual dead-letter.
    - name: instant-worker-propagation-skip
      rules:
        - alert: PropagationUnexpectedSkip
          expr: |
            sum(rate(instant_propagation_unexpected_skip_total[15m])) by (kind, resource_type, skip_reason) > 0
          for: 15m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "propagation_runner unexpected_skip {{ $labels.kind }} / {{ $labels.resource_type }} / {{ $labels.skip_reason }}"
            description: |
              instant_propagation_unexpected_skip_total{kind="{{ $labels.kind }}",resource_type="{{ $labels.resource_type }}",skip_reason="{{ $labels.skip_reason }}"} > 0 for >15m.
              The post-CHAOS-F1 fix means the row is now counted as a Failure (will eventually dead-letter and fire PropagationDeadLettered above) — but the operator should investigate the schema/state drift NOW. Find the row in pending_propagations, walk back to the api caller, and decide whether the missing resource should be inserted, the propagation row should be aborted, or the underlying race condition should be patched.

    # Email pipeline SEND-side (worker → Brevo /v3/smtp/email). RECEIVE-side
    # (Brevo → /webhooks/brevo) is covered by the NR email-delivery-ratio
    # alert. The classification label separates fixable-by-key-rotation
    # (permanent: 401/403) from fixable-by-backoff (transient: 5xx, 429) so the
    # operator knows which runbook to follow.
    - name: instant-worker-brevo-send
      rules:
        - alert: BrevoSendErrorsSpike
          expr: |
            sum(rate(brevo_send_errors_total[10m])) by (classification, status_code) * 600 > 10
          for: 10m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "brevo_send_errors_total > 10 in 10m (classification={{ $labels.classification }} status={{ $labels.status_code }})"
            description: |
              Worker → Brevo /v3/smtp/email is failing at >10 errors / 10m. Brevo
              returns 201 the instant it accepts a POST, so a degraded send path
              never affects the delivery-ratio alert — the messages simply never
              queue at Brevo. Check classification: `permanent` (401/403) means
              rotate BREVO_API_KEY; `transient` (5xx/429) means upstream
              brown-out, the worker's exponential backoff will catch up.

        - alert: BrevoSendErrorsWarning
          expr: |
            sum(rate(brevo_send_errors_total[10m])) by (classification, status_code) * 600 > 3
          for: 10m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "brevo_send_errors_total > 3 in 10m (early warning) classification={{ $labels.classification }}"
            description: |
              Lower-severity early-warning twin of BrevoSendErrorsSpike. Lets the
              operator catch a slow upstream brown-out before it crosses the page
              threshold. No paging — just investigate during business hours.

    # Login throttle — magic-link rate limiter denial counter. Noisier than a
    # page; fires WARNING on >10 events in 10m so the operator can correlate
    # against a /auth/login spike (legitimate users locked out by NAT, dashboard
    # retry bug, bot sweep).
    - name: instant-api-magic-link
      rules:
        - alert: MagicLinkEmailRateLimited
          expr: |
            sum(rate(instant_magic_link_email_rate_limited_total[10m])) * 600 > 10
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "magic-link rate-limiter denied > 10 requests in 10m"
            description: |
              instant_magic_link_email_rate_limited_total > 10 events in 10m.
              Per-email/per-IP magic-link throttle is denying real users at a
              meaningful rate. Cross-check /auth/login traffic — a spike in
              denials with no spike in requests means the dashboard is firing
              retry storms; a spike in both means a bot sweep is wedging the
              per-IP quota for legitimate users behind the same NAT.

    # Provisioner circuit breaker state. 0=CLOSED (healthy), 1=HALF_OPEN
    # (probing), 2=OPEN (fail-fast). Sustained OPEN means the provisioner
    # stopped attempting calls to a backend after N consecutive failures —
    # better than a hung call, but the customer flow is degraded.
    - name: instant-provisioner-circuit
      rules:
        - alert: ProvisionerCircuitOpen
          expr: |
            max(instant_provisioner_circuit_state) by (backend) == 2
          for: 5m
          labels:
            severity: critical
            service: provisioner
          annotations:
            summary: "provisioner circuit breaker OPEN for backend={{ $labels.backend }}"
            description: |
              instant_provisioner_circuit_state{backend="{{ $labels.backend }}"} = 2
              (OPEN) for >5m. The provisioner has stopped attempting calls to
              this backend; all /db/new, /cache/new, /nosql/new, or /queue/new
              requests targeting this backend are failing fast. Check the
              backend's own /healthz, kubectl logs the upstream pod, and decide:
              roll back the failing change, restart the backend pod, or wait
              for the half-open probe to close the breaker naturally.

        - alert: ProvisionerCircuitHalfOpen
          expr: |
            max(instant_provisioner_circuit_state) by (backend) == 1
          for: 10m
          labels:
            severity: warning
            service: provisioner
          annotations:
            summary: "provisioner circuit breaker HALF_OPEN sustained 10m for backend={{ $labels.backend }}"
            description: |
              Backend hasn't closed back to CLOSED after 10 minutes in
              HALF_OPEN. Probes are still failing intermittently; investigate
              the upstream before the breaker flips back to OPEN.

    # Go-rendered email registry sentinel. After 2026-05-15 expiry-email retro
    # the platform moved 18 email kinds off Brevo templates onto Go renderers.
    # This counter ticks every time the worker tries to send an email kind
    # that isn't in the eventEmailBuilders registry — a silent user-facing
    # breakage that page-priority must be P0.
    - name: instant-worker-email-renderer
      rules:
        - alert: EmailMissingRenderer
          expr: |
            sum(rate(email_missing_renderer_total[5m])) by (kind) > 0
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "email_missing_renderer kind={{ $labels.kind }} — silent user-facing breakage"
            description: |
              email_missing_renderer_total{kind="{{ $labels.kind }}"} > 0 for >5m.
              The worker tried to send an email with a kind that has no Go
              renderer registered in eventEmailBuilders — the message body
              dropped silently on the floor. Add the renderer to
              worker/internal/email/renderers/ AND add the kind to the
              coverage test that iterates eventEmailBuilders so this can't
              happen again for the same kind.

    # Failover-ESP engagement. The worker's FailoverProvider
    # (worker/internal/email/failover_provider.go) emits
    # instant_email_failover_total{outcome} on every send when
    # EMAIL_PROVIDER_FALLBACK is configured. Two alert-able outcomes:
    #   fallback_ok — primary ESP (Brevo) failed/rejected but the secondary
    #                 (SES) sent the email. Email is NOT lost, but the primary
    #                 is degraded and the failover is carrying load → P1.
    #   all_failed  — every ESP in the chain refused the send. Email IS being
    #                 lost → P0. This is the failure mode the feature exists to
    #                 surface (the standing Brevo-sender-unvalidated P0 with no
    #                 working secondary).
    # primary_ok is the healthy path and is deliberately NOT alerted.
    - name: instant-worker-email-failover
      rules:
        - alert: EmailFailoverEngaged
          expr: |
            sum(rate(instant_email_failover_total{outcome="fallback_ok"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "Email failover engaged — primary ESP degraded, secondary carrying load"
            description: |
              instant_email_failover_total{outcome="fallback_ok"} rate > 0 for
              >10m. The primary ESP (Brevo) is failing or rejecting sends and
              the configured secondary (SES) is delivering them instead. Email
              is still flowing, but the primary needs attention — check
              brevo_send_errors_total by classification and the Brevo sender-
              domain validation status.
        - alert: EmailFailoverAllFailed
          expr: |
            sum(rate(instant_email_failover_total{outcome="all_failed"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "Email failover ALL providers failed — email is being LOST"
            description: |
              instant_email_failover_total{outcome="all_failed"} rate > 0 for
              >5m. Every ESP in the failover chain (primary + all secondaries)
              refused the send — transactional email is being dropped on the
              floor. Check both BREVO_API_KEY/sender validation and the SES_*
              credentials + SES sandbox/production-access state immediately.

    # /readyz deep-health gauge, exposed by api, worker, and provisioner via
    # readyz_check_status{service,check}. 1=ok, 0.5=degraded, 0=failed. This
    # rule mirrors the NR alert readyz-component-failed.json (which depends
    # on the OTLP forwarder) so a Prometheus-only operator gets the same
    # coverage. Same thresholds. Same labels.
    - name: instant-readyz
      rules:
        - alert: ReadyzCheckFailed
          expr: |
            max(readyz_check_status) by (service, check) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} /readyz check {{ $labels.check }} is FAILED"
            description: |
              readyz_check_status{service="{{ $labels.service }}",check="{{ $labels.check }}"} == 0 for >5m.
              The upstream this check probes is unreachable or rejecting calls.
              Open the failing pod's /readyz body for last_error, cross-check
              against the upstream status page, rotate keys if 401, file an
              incident if 5xx.

        - alert: ReadyzCheckDegraded
          expr: |
            max(readyz_check_status) by (service, check) == 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} /readyz check {{ $labels.check }} is DEGRADED"
            description: |
              readyz_check_status{service="{{ $labels.service }}",check="{{ $labels.check }}"} == 0.5 for >10m.
              Upstream reachable but creds/policy off (the exact pattern that
              would have caught the 2026-05-20 Brevo silent-rejection bug weeks
              earlier — Brevo /v3/account returns 401 on every probe and the
              brevo check goes 0.5). Rotate the credential / re-validate the
              policy before the breaker escalates to failed.

    # Idempotency replay refund — FINDING API-1 (fix 2026-05-29). Every
    # cache HIT in the Idempotency middleware refunds the per-fingerprint
    # daily rate-limit counter. A steady non-zero rate is HEALTHY (agents
    # honouring the published Stripe-shape replay contract). A spike on
    # one route correlates with an upstream brownout driving agent retry
    # storms — flip to NR and check the matching 5xx rate. Threshold is
    # noisier than a page (>50/10m) — paging would fire on every routine
    # retry storm; the operator pages on the correlated 5xx alert.
    - name: instant-api-idempotency
      rules:
        - alert: IdempotencyReplayRefundSpike
          expr: |
            sum(rate(instant_idempotency_replay_refunded_total[10m])) by (route) * 600 > 50
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "idempotency replay refunds > 50 in 10m on route {{ $labels.route }}"
            description: |
              instant_idempotency_replay_refunded_total spiked > 50 events
              in 10m on route {{ $labels.route }}. Each tick = one cache HIT
              that refunded the per-fingerprint rate-limit slot — agents
              are retrying with the same Idempotency-Key. Healthy means an
              upstream blip is being absorbed; unhealthy means an upstream
              is sustainedly returning 5xx and agents are wedged in retry.
              Cross-check the api 5xx rate for the same route; if also up,
              page on the 5xx alert and investigate the corresponding
              backend (provisioner, customer-DB, NATS).

    # Brevo RECEIVE-side delivery-ratio alert (Prom mirror of NR
    # email-delivery-ratio-low.json). Webhook receiver counter
    # brevo_webhook_events_total{event} — `delivered` / total over 1h.
    # The 2026-05-20 sender-domain dropout would have shown here within an
    # hour as a falling ratio. Closed-set event labels keep cardinality
    # bounded.
    - name: instant-api-brevo-webhook
      rules:
        - alert: BrevoDeliveryRatioLow
          expr: |
            (
              sum(rate(brevo_webhook_events_total{event="delivered"}[1h]))
            )
            /
            clamp_min(
              sum(rate(brevo_webhook_events_total{event=~"delivered|bounced_hard|bounced_soft|rejected|complaint|deferred|unsubscribed|error"}[1h])),
              1e-9
            )
            < 0.95
          for: 1h
          labels:
            severity: critical
            service: api
          annotations:
            summary: "Brevo delivery ratio < 95% over 1h"
            description: |
              <95% of webhook-confirmed Brevo POSTs are landing as `delivered`.
              Common causes: sender domain dropped from validated list (the
              2026-05-20 launch incident), DKIM record stale, IP on a blocklist,
              or a broad bounce/rejected event class spiking.

        - alert: BrevoDeliveryRatioWarn
          expr: |
            (
              sum(rate(brevo_webhook_events_total{event="delivered"}[1h]))
            )
            /
            clamp_min(
              sum(rate(brevo_webhook_events_total{event=~"delivered|bounced_hard|bounced_soft|rejected|complaint|deferred|unsubscribed|error"}[1h])),
              1e-9
            )
            < 0.98
          for: 1h
          labels:
            severity: warning
            service: api
          annotations:
            summary: "Brevo delivery ratio < 98% over 1h (early warning)"

    # Make-good worklist signal — billing.charge_undeliverable. Customer paid
    # via Razorpay, platform could NOT translate the charge into a delivered
    # upgrade (team unresolvable, or resolved plan tier not in plans.yaml).
    # Each occurrence is a real customer charged but not upgraded; operator
    # must reconcile in the Razorpay dashboard.
    - name: instant-worker-billing
      rules:
        - alert: BillingChargeUndeliverable
          expr: |
            sum(rate(instant_billing_charge_undeliverable_total[1h])) > 0
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "billing.charge_undeliverable > 0 — paid customer not upgraded"
            description: |
              instant_billing_charge_undeliverable_total > 0 in the last hour.
              A subscription.charged Razorpay webhook confirmed a real card
              charge that the platform could NOT translate into a delivered
              upgrade. Find the team in audit_log where audit_kind = 'billing.charge_undeliverable',
              cross-check against the Razorpay dashboard, refund or hand-grant
              the tier.

    # AUTH-004 synthetic prober. Every 5 minutes the worker drives the full
    # browser-shaped login loop against prod (/auth/email/start +
    # /auth/exchange CORS contract + /auth/me bearer). Any fail outcome
    # over a 10-minute window pages — two consecutive ticks of fail is
    # unambiguous regression, not flake. Mirrors auth-probe-fail.json in
    # newrelic/alerts/.
    - name: instant-worker-auth-probe
      rules:
        - alert: AuthProbeFail
          expr: |
            sum(increase(instant_auth_probe_outcome_total{result="fail"}[10m])) > 0
          for: 10m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "AUTH-004 synthetic prober fail (login loop broken in prod)"
            description: |
              instant_auth_probe_outcome_total{result="fail"} > 0 in 10m.
              The synthetic prober drives the full browser-shaped login
              loop against prod every 5 minutes. A fail outcome means one
              of: /auth/email/start non-202, /auth/exchange missing
              Access-Control-Allow-Origin / Access-Control-Allow-Credentials
              (the AUTH-004 regression class), or /auth/me bearer rejected.
              Cross-correlate against audit_log kind=auth_probe_failed +
              the worker structured slog ERROR `auth_probe_failed leg=...
              reason=...`. Source: worker/internal/jobs/auth_probe.go.

    # Hourly synthetic deploy prober. Every 60 minutes the worker drives
    # a real end-to-end deploy against prod (POST /deploy/new with
    # redeploy=true → Kaniko build + k8s rollout → status poll until
    # healthy → public-host GET expecting 200). Any fail outcome over a
    # 30-minute window pages — at the 60-minute cadence a single fail
    # IS already a regression, so the 30-minute window guarantees a
    # P0 inside one tick rather than waiting two cycles (90 minutes of
    # broken deploys before paging would be too long given the platform
    # promises agent-driven deploys as a paid wedge). Mirrors
    # deploy-probe-fail.json in newrelic/alerts/.
    - name: instant-worker-deploy-probe
      rules:
        - alert: DeployProbeFail
          expr: |
            sum(increase(instant_deploy_probe_outcome_total{result="fail"}[30m])) > 0
          for: 30m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "Hourly deploy prober fail (deploy pipeline broken in prod)"
            description: |
              instant_deploy_probe_outcome_total{result="fail"} > 0 in 30m.
              The hourly deploy prober drives a real end-to-end deploy
              against prod every 60 minutes. A fail outcome means one of:
              /deploy/new returned non-2xx (api crashed, GHCR auth broken,
              tier-limit miscount), the status row stayed `building` past
              the 90s budget OR flipped to `failed` (Kaniko crash,
              image-pull-backoff — the exact stuck-build class that hid
              the 2026-05-30 morning truehomie-api incident for ~30 min),
              or the public *.deployment.instanode.dev URL returned non-200
              after `healthy` (Ingress / TLS / pod-readiness regression).
              Cross-correlate against audit_log kind=deploy_probe_failed +
              the worker structured slog ERROR `deploy_probe_failed leg=...
              reason=...`. Source: worker/internal/jobs/deploy_probe.go.

    # Layer-3 payment prober (the money heartbeat). Every 5 minutes the
    # worker drives the iframe-free payment-funnel contract path against
    # prod: checkout reachability (POST /api/v1/billing/checkout, non-5xx),
    # billing + invoices read surfaces (non-5xx), the webhook signature
    # SECURITY contract (POST /razorpay/webhook with a garbage unsigned
    # payload MUST be rejected 400 invalid_signature), and an OPTIONAL
    # test-mode upgrade proof (inject a correctly-signed TEST webhook →
    # assert teams.plan_tier flips → reap the cohort team). Any fail
    # outcome over a 10-minute window pages — at the 5-minute cadence two
    # consecutive fail ticks is an unambiguous paid-funnel regression, not
    # a flake. result="degraded" is the config-unset / slow-but-correct
    # state (no test webhook secret, no JWT secret, or over-budget) and is
    # EXCLUDED, so the prober never false-pages before the operator lights
    # PAYMENT_PROBE_ENABLED. Mirrors payment-probe-fail.json in
    # newrelic/alerts/. Forum verdict: docs/ci/FORUM-PAYMENT-E2E-TOOLING.md §4.
    - name: instant-worker-payment-probe
      rules:
        - alert: PaymentProbeFail
          expr: |
            sum(increase(instant_payment_probe_outcome_total{result="fail"}[10m])) > 0
          for: 10m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "Layer-3 payment prober fail (paid revenue path broken in prod)"
            description: |
              instant_payment_probe_outcome_total{result="fail"} > 0 in 10m.
              The Layer-3 payment prober (the money heartbeat) drives the
              iframe-free payment-funnel contract path against prod every 5
              minutes. A fail outcome means one of: checkout_reachable —
              POST /api/v1/billing/checkout returned a 5xx (handler crash;
              a 402/409/502 blocked-but-alive shape is a PASS while Razorpay
              live-recurring is operator-blocked); billing_state /
              invoices_reachable — GET /api/v1/billing[/invoices] 5xx (a
              paid-tier read-surface regression); webhook_security — the
              /razorpay/webhook signature gate ACCEPTED an unsigned payload
              (a CRITICAL security regression — a forged success could drive
              a free upgrade) OR returned a non-canonical error_code; or
              upgrade_webhook_e2e — a signed TEST-mode subscription.charged
              did NOT flip teams.plan_tier (the rule-12 downstream truth
              surface, NOT a webhook 200). Cross-correlate against audit_log
              kind=payment_probe_failed + the worker structured slog ERROR
              `payment_probe_failed leg=... reason=...`. Source:
              worker/internal/jobs/payment_probe.go.

    # GitHub App push-to-deploy pipeline (P4, pre-staged 2026-06-03).
    # Metrics emitted by api/internal/handlers/github_webhook.go:
    #   instant_github_webhook_received_total{event,result}
    #   instant_github_pushdeploy_total{result}
    #   instant_github_app_token_mint_total{result}
    # All three are lazy CounterVec — label series only materialise on
    # the first observation of each {event,result} combination.
    # Mirror of newrelic/alerts/github-webhook-bad-signature.json (P2)
    # and newrelic/alerts/github-pushdeploy-error.json (P1).
    - name: instant-github
      rules:
        # Bad-signature spike — spoofing or GITHUB_WEBHOOK_SECRET mismatch.
        # P2/abuse: WARNING only; common on secret rotations that update one
        # side before the other. A sustained rate across multiple 5m windows
        # indicates an active spoofing campaign.
        - alert: GitHubWebhookBadSignatureSpike
          expr: |
            increase(instant_github_webhook_received_total{result="bad_signature"}[10m]) > 0
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "GitHub webhook bad_signature > 0 in 10m — spoofing attempt or GITHUB_WEBHOOK_SECRET mismatch"
            description: |
              instant_github_webhook_received_total{result="bad_signature"} > 0
              for >10m. Either an attacker is probing the /webhooks/github endpoint
              with forged payloads, or GITHUB_WEBHOOK_SECRET in instant-secrets has
              drifted from the secret configured in the GitHub App settings (the
              modal cause: secret rotated on one side without updating the other).
              Investigate: grep NR Logs api message='github.webhook.bad_signature'
              for delivery_id + client IP. If single-IP: active spoofing — rotate
              secret + update GitHub App settings. If legitimate delivery_id: secret
              mismatch — re-sync: `kubectl set env -n instant deploy/instant-api
              GITHUB_WEBHOOK_SECRET=$(openssl rand -hex 32)` then update the GitHub
              App webhook settings to match. Source: api/internal/handlers/
              github_webhook.go. NR mirror: newrelic/alerts/github-webhook-bad-signature.json.

        # Push-deploy enqueue error — developer pushes to linked repo, deploy
        # silently not triggered due to an internal error (DB write, quota panic,
        # provisioner unreachable). P1 user-visible: the only symptom is that no
        # deploy appears in their dashboard. result=rate_limited and no_connection
        # are not alerted here (expected states). Only result=error indicates a
        # broken pipeline path.
        - alert: GitHubPushDeployError
          expr: |
            increase(instant_github_pushdeploy_total{result="error"}[15m]) > 0
          for: 15m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "GitHub push-to-deploy enqueue errors > 0 in 15m — pushes silently not deploying (P1)"
            description: |
              instant_github_pushdeploy_total{result="error"} > 0 for >15m.
              A GitHub push webhook was received, matched an installation+connection,
              but the deploy could NOT be enqueued due to an internal error. The user
              sees: push to their linked repo → no deploy started → no error shown.
              Investigate: grep NR Logs api message='github.pushdeploy.error' for
              installation_id, repo, branch, and raw error. Common root causes:
              (a) River job enqueue failing — DB unreachable; (b) deploy quota check
              returning an unexpected error instead of 402; (c) nil-pointer in push
              payload parser on an unusual GitHub event shape. Source: api/internal/
              handlers/github_webhook.go push handler → deploy enqueue path.
              NR mirror: newrelic/alerts/github-pushdeploy-error.json.

    # instant-worker — entitlement drift outpacing regrade (Rule 25 sweep 2026-06-04).
    # The entitlement_reconciler DETECTS Postgres resources whose connection cap no
    # longer matches their team's plan tier (instant_entitlement_drift_detected_total)
    # and RE-GRADES them up to the entitled value (instant_entitlement_regraded_total).
    # In steady state detected ≈ regraded on each sweep. When detected outpaces
    # regraded over a window, paying customers are stuck on lower-tier backend limits
    # and the reconciler can't keep up (pair with EntitlementRegradeFailed above, which
    # fires on the gRPC-error / provisioner-skip leg). NR mirror:
    # newrelic/alerts/entitlement-drift-outpacing-regrade.json.
    - name: instant-worker-entitlement-drift
      rules:
        - alert: EntitlementDriftOutpacingRegrade
          # Minimum-count floor (>= 1): the detected increase must exceed the
          # regraded increase by at least one whole resource over the aligned 1h
          # window. A bare `increase(...) > increase(...)` flaps at window edges
          # near zero (sub-1 fractional increase() extrapolation on either series
          # crossing back and forth); the `>= 1` floor plus `for: 30m` requires a
          # real, sustained, whole-resource backlog before paging.
          expr: |
            (
              increase(instant_entitlement_drift_detected_total[1h])
                - increase(instant_entitlement_regraded_total[1h])
            ) >= 1
          for: 30m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "entitlement drift detected faster than regraded for 30m — paying customers on wrong backend limits"
            description: |
              increase(instant_entitlement_drift_detected_total[1h]) >
              increase(instant_entitlement_regraded_total[1h]) for >30m. The
              entitlement_reconciler is finding more Postgres resources drifted below
              their team's paid tier than it can successfully re-grade — drift is
              accumulating. This is the F6 partial-upgrade symptom at scale: team rows
              flip to the paid tier but the backend connection cap lags. Grep worker
              logs for `jobs.entitlement_reconciler.regrade_failed` (the failing leg)
              and check provisioner /healthz + circuit-breaker state. Pair with
              EntitlementRegradeFailed (instant_entitlement_regrade_failed_total).

    # instant-worker — silent-deploy-failure backstop (CLAUDE.md rule 27, Rule 25
    # sweep 2026-06-04). deploy_status_reconcile now queries BatchV1().Jobs after the
    # runtime Deployment query so a Failed Kaniko build Job flips the deployments row
    # to 'failed' even when the build pod is GC'd first (Bug A, 2026-05-30 incident).
    # reason="DeadlineExceeded" = build slot timing out for many tenants (image bloat /
    # degraded GHCR push); reason="BackoffLimitExceeded" = the modal per-customer
    # Dockerfile-error bucket. Threshold increase(...[30m]) >= 3 catches a platform-
    # wide build degradation while tolerating one or two individual bad Dockerfiles.
    # NR mirror: newrelic/alerts/deploy-job-failed-detected.json.
    - name: instant-worker-deploy-job-failed
      rules:
        - alert: DeployJobFailedDetected
          # Absolute count over a 30m window, not a per-second rate. The previous
          # `rate(...[15m]) > 0.5` = 30 failed build-Jobs/minute sustained 30m, a
          # threshold a real silent-deploy-failure cluster (a handful of Failed
          # Jobs) would never reach — so it could effectively never fire. `increase
          # (...[30m]) >= 3` pages on a small cluster of failed build Jobs while
          # tolerating one or two individual bad Dockerfiles (the modal per-customer
          # BackoffLimitExceeded case). Matches newrelic/alerts/deploy-job-failed-detected.json.
          expr: |
            sum(increase(instant_deploy_job_failed_detected_total[30m])) >= 3
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "deploy build-Jobs failing — >= 3 in 30m, platform-wide build degradation"
            description: |
              sum(increase(instant_deploy_job_failed_detected_total[30m])) >= 3.
              deploy_status_reconcile is detecting Kaniko build Jobs landing in a Failed
              state at a sustained rate. reason="DeadlineExceeded" means the build slot is
              timing out for many tenants (image bloat or a degraded GHCR push path);
              reason="BackoffLimitExceeded" is the per-customer Dockerfile-error bucket
              (expected at a low rate — a platform-wide spike means something common
              broke). This is the metric from the 2026-05-30 silent-deploy-failure
              incident. Check ghcr.io status, the deploy.yml CI push step, and Kaniko
              build pod logs in instant-deploy-* namespaces. Source:
              worker/internal/jobs/deploy_status_reconcile.go.

    # instant-worker — runtime rollout-failure detector (2026-06-08). Twin of the
    # build-Job detector above, for the RUNTIME side: the build SUCCEEDED but the
    # produced image can't start (CreateContainerError "no command specified",
    # ImagePullBackOff, CrashLoopBackOff). deploy_status_reconcile now maps a
    # ProgressDeadlineExceeded rollout with no available replica to 'failed'
    # (was 'deploying' forever). instant_deploy_runtime_failed_detected_total
    # {reason} is emitted by worker/internal/jobs/deploy_status_reconcile.go.
    - name: instant-worker-deploy-runtime-failed
      rules:
        - alert: DeployRuntimeFailedDetected
          # Absolute count over a 30m window (same posture as DeployJobFailedDetected).
          # A single broken-image deploy is per-customer and expected at a low rate;
          # >= 3 in 30m means a PLATFORM build defect is producing unstartable images
          # (e.g. empty 474-byte images with no CMD — the 2026-06-08 live symptom)
          # or a registry/pull-secret regression. Matches
          # newrelic/alerts/deploy-runtime-failed-detected.json.
          expr: |
            sum(increase(instant_deploy_runtime_failed_detected_total[30m])) >= 3
          for: 5m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "deploys failing to start at runtime — >= 3 in 30m, likely a platform image defect"
            description: |
              sum(increase(instant_deploy_runtime_failed_detected_total[30m])) >= 3.
              deploy_status_reconcile is flipping rollouts to 'failed' because they
              exceeded their progress deadline with no available replica — the pods were
              created but their containers can't start (broken built image: no
              CMD/ENTRYPOINT, ImagePullBackOff, or CrashLoopBackOff). A platform-wide
              spike means the build pipeline is producing unstartable images (check for
              empty/near-zero-byte images in ghcr.io/.../instant-userapp/*) or a
              registry/pull-secret regression. Per-customer this is a one-off bad image.
              Source: worker/internal/jobs/deploy_status_reconcile.go (counter
              DeployRuntimeFailedDetectedTotal); user-facing reason=StartFailed.

    # instant-worker — scale-to-zero idle-scaler (Task #54).
    # instant_deploy_scaled_to_zero_total{outcome} is emitted by
    # worker/internal/jobs/deploy_idle_scaler.go. INERT until an operator sets
    # DEPLOY_SCALE_TO_ZERO_ENABLED (default off), so these rules sit quiet until
    # the feature is canaried on. wake_failed = a user's app may be stuck asleep
    # (P1, user-visible recoverable); scale_failed = a scale-DOWN k8s patch / DB
    # flip failed (P2, the row is left untouched + retried next tick).
    - name: instant-worker-deploy-scale-to-zero
      rules:
        - alert: DeployScaleToZeroWakeFailed
          expr: |
            sum(increase(instant_deploy_scaled_to_zero_total{outcome="wake_failed"}[15m])) > 0
          for: 10m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "scale-to-zero wake failures > 0 (15m) — an app may be stuck asleep"
            description: |
              instant_deploy_scaled_to_zero_total{outcome="wake_failed"} increased over the
              last 15m, sustained 10m. A scaled-to-zero app failed to wake (k8s scale-up
              error), so a customer request to a sleeping app is returning the ingress
              upstream-down response with no recovery. Check instant-worker logs for
              `jobs.deploy_idle_scaler` and the api `deploy.wake.scale_failed` lines, and
              the health of the instant-deploy-* namespaces. Source:
              worker/internal/jobs/deploy_idle_scaler.go + api deploy_wake.go.
        - alert: DeployScaleToZeroScaleDownFailures
          expr: |
            sum(increase(instant_deploy_scaled_to_zero_total{outcome="scale_failed"}[30m])) >= 5
          for: 30m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "scale-to-zero scale-DOWN failures >= 5 in 30m"
            description: |
              instant_deploy_scaled_to_zero_total{outcome="scale_failed"} reached >= 5 in
              30m. The idle-scaler is repeatedly failing to deschedule idle apps (k8s patch
              or DB flip error). Apps stay running (no customer impact) but the compute
              savings are not landing. Check instant-worker RBAC for deployments/patch and
              the k8s API health. Source: worker/internal/jobs/deploy_idle_scaler.go.

    # instant-worker — billing reconciler gap detected (Rule 25 sweep 2026-06-04).
    # instant_billing_reconciler_gap_detected_total is the PRIMARY signal for a
    # dropped Razorpay webhook: each gap = a team whose teams.plan_tier disagrees
    # with Razorpay's live subscription state. direction="upgrade" = paid but DB
    # stuck low (customer-harming); direction="downgrade" = DB still high after a
    # cancel (revenue leak). The reconciler self-corrects (gap_corrected) but a
    # steady drip of detections means the synchronous webhook path is dropping
    # payments. Threshold >3 in 15m avoids paging on a single transient race the
    # next sweep clears. NR mirror: newrelic/alerts/billing-reconciler-gap-detected.json.
    - name: instant-worker-billing-gap
      rules:
        - alert: BillingReconcilerGapDetected
          expr: |
            sum(increase(instant_billing_reconciler_gap_detected_total[15m])) by (direction) > 3
          for: 0m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "billing reconciler gap_detected > 3 in 15m (direction={{ $labels.direction }}) — dropped Razorpay webhook"
            description: |
              instant_billing_reconciler_gap_detected_total{direction="{{ $labels.direction }}"} > 3 in 15m.
              The billing reconciler found teams whose DB plan_tier disagrees with
              Razorpay's live subscription state — the primary signal for dropped
              Razorpay webhooks. direction="upgrade" = paying customer stuck on a lower
              tier (charge it and they don't get it); direction="downgrade" = team still
              on a higher tier after a cancel/downgrade (revenue leak). The reconciler
              self-corrects via instant_billing_reconciler_gap_corrected_total, but a
              sustained detection rate means the synchronous webhook → upgrade path is
              dropping events — investigate the Razorpay webhook handler + delivery logs.
              Source: worker/internal/jobs/billing_reconciler.go.

    # instant-* — Postgres pool saturation (Wave-3 chaos-verify 2026-05-21, Rule 25
    # sweep 2026-06-04). instant_pg_pool_in_use / instant_pg_pool_max is the saturation
    # ratio, emitted independently by api, worker AND provisioner (each labelled by
    # pool, e.g. platform_db), sampled every 5s. The 2026-05-21 burst exhausted the
    # shared DO Managed Postgres user-connection ceiling and starved worker's
    # event_email_forwarder. The by-(service,pool) facet localizes which process is
    # saturating. NR mirror: newrelic/alerts/pg-pool-saturation.json.
    - name: instant-pg-pool
      rules:
        - alert: PGPoolSaturation
          expr: |
            max(instant_pg_pool_in_use) by (service, pool)
              / clamp_min(max(instant_pg_pool_max) by (service, pool), 1) > 0.8
          for: 5m
          labels:
            severity: critical
            service: platform
          annotations:
            summary: "Postgres pool > 80% saturated for 5m (service={{ $labels.service }} pool={{ $labels.pool }})"
            description: |
              instant_pg_pool_in_use / instant_pg_pool_max > 0.8 for >5m on
              service={{ $labels.service }} pool={{ $labels.pool }}. The process is
              running near its SetMaxOpenConns ceiling; new connection acquisitions will
              start queueing (watch instant_pg_pool_wait_count steepening) and, against
              the shared DO Managed Postgres user-connection cap, can starve OTHER
              processes — the 2026-05-21 Wave-3 class where a /db/new burst left worker's
              event_email_forwarder with no slots ("remaining connection slots are
              reserved for non-replication superuser connections"). Decide: raise the
              pool max, add a read replica, or shed load. Source: api/worker/provisioner
              pool_metrics.go exporters.

    # instant-worker — Redis maxmemory regrade failing (A4 reconciler, Rule 25 sweep
    # 2026-06-04). instant_redis_maxmemory_failed_total increments when the A4
    # entitlement_reconciler arm's provisioner RegradeResource call returns a gRPC
    # transport error (NOT a soft skip — those are instant_redis_maxmemory_skipped_total).
    # A sustained non-zero rate means the maxmemory cap is not being pushed onto one or
    # more dedicated Redis pods → that tenant's Redis quota is NOT enforced. Fail-soft
    # (retried next sweep), so a transient blip self-heals. P2 abuse/observability. NR
    # mirror: newrelic/alerts/redis-maxmemory-regrade-failed.json.
    - name: instant-worker-redis-maxmemory
      rules:
        - alert: RedisMaxmemoryRegradeFailed
          expr: |
            sum(rate(instant_redis_maxmemory_failed_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "Redis maxmemory regrade failing for 15m — quota not enforced on dedicated pods"
            description: |
              instant_redis_maxmemory_failed_total rate > 0 for >15m. The A4
              entitlement_reconciler arm could not push the tier maxmemory cap onto one
              or more dedicated k8s Redis pods (provisioner RegradeResource returned a
              gRPC error). Those tenants' Redis quota is not being enforced — a tenant
              can grow unbounded and evict/starve neighbours on the node. Fail-soft: the
              row retries on the next sweep, so a single blip self-heals; a sustained
              rate means the provisioner ↔ Redis path is broken. Check provisioner
              /healthz, the redis-auth Secret, and worker logs
              `jobs.entitlement_reconciler` Redis arm. Source:
              worker/internal/jobs/entitlement_reconciler.go.

    # instant-worker — expiry deprovision failing (MR-P0-1a, Rule 25 sweep 2026-06-04).
    # instant_expire_deprovision_failed_total increments when the 24h-TTL reaper's
    # provisioner DeprovisionResource call errors. Per MR-P0-1a the reaper LEAVES the
    # row reapable (not marked deleted) so the next tick retries, preventing a leak.
    # A single transient failure self-heals; a SUSTAINED rate means teardowns are
    # broken and orphan infra (k8s namespaces, customer DBs, Redis ACL users) is
    # accumulating unreclaimed — a slow capacity/cost leak. NR mirror:
    # newrelic/alerts/expire-deprovision-failed.json.
    - name: instant-worker-expire-deprovision
      rules:
        - alert: ExpireDeprovisionFailed
          expr: |
            sum(rate(instant_expire_deprovision_failed_total[15m])) > 0
          for: 30m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "expiry deprovision failing for 30m — orphan infra accumulating"
            description: |
              instant_expire_deprovision_failed_total rate > 0 for >30m. The 24h-TTL
              reaper is failing to tear down the physical backend for expired
              anonymous/free resources (provisioner DeprovisionResource errored). Per
              MR-P0-1a the row is left reapable so the next tick retries — so a single
              blip self-heals — but a sustained rate means teardowns are broken and
              orphan infrastructure (k8s namespaces, customer DBs, Redis ACL users) is
              piling up unreclaimed, a slow capacity and cost leak. Cross-check the
              orphan_sweep alerts (the second line of defence) and provisioner /healthz.
              Source: worker/internal/jobs/expire.go.

    # Hot-pool reaper (provisioner sweep #8). The maintenance loop reaps 'failed'
    # pool_items (deprovision backing infra + delete the row) and reports — but
    # does NOT auto-reap — pool_items stuck in 'assigned' past 30m. Source:
    # provisioner/internal/pool/{manager,metrics}.go. NR mirrors:
    # newrelic/alerts/pool-reap-errors.json + pool-stuck-assigned.json.
    - name: instant-provisioner-pool-reaper
      rules:
        - alert: PoolReapErrors
          expr: |
            sum(rate(instant_pool_reap_total{outcome=~"deprovision_err|delete_err"}[15m])) by (resource_type, outcome) > 0
          for: 30m
          labels:
            severity: warning
            service: provisioner
          annotations:
            summary: "pool reaper failing (outcome={{ $labels.outcome }} resource_type={{ $labels.resource_type }}) for 30m"
            description: |
              instant_pool_reap_total{outcome="{{ $labels.outcome }}"} rate > 0 for
              >30m for resource_type={{ $labels.resource_type }}. The hot-pool reaper
              found a 'failed' pool_item but could not fully reclaim it:
              outcome="deprovision_err" = the backend Deprovision call errored (row
              left for next tick); outcome="delete_err" = Deprovision succeeded but
              the pool_items row DELETE failed (the row will be retried, but the
              backing infra is already gone — watch for double-deprovision noise). A
              single transient blip self-heals on the next 30s tick; a sustained rate
              means the reaper is wedged and 'failed' pool infra (customer DBs, Redis
              ACL users, NATS accounts) is accumulating unreclaimed — a slow capacity
              and cost leak. Check provisioner pod logs for `pool.reapStale` errors and
              the targeted backend's /healthz. Source:
              provisioner/internal/pool/manager.go (reapStale).

        - alert: PoolStuckAssigned
          expr: |
            max(instant_pool_stuck_assigned) by (resource_type) > 0
          for: 1h
          labels:
            severity: warning
            service: provisioner
          annotations:
            summary: "pool_items stuck 'assigned' past 30m for resource_type={{ $labels.resource_type }} — leaked shared infra, operator action"
            description: |
              instant_pool_stuck_assigned{resource_type="{{ $labels.resource_type }}"}
              > 0 sustained for >1h. One or more pool_items have sat in the 'assigned'
              state past the 30m grace. The provisioner deliberately does NOT
              auto-reap these: from its own DB an orphaned (crashed-claim) 'assigned'
              row is indistinguishable from one a live api request successfully bound
              to a resources row, and deprovisioning a bound item destroys live
              customer infra (the truehomie-db DROP incident class). A persistently
              non-zero value means the claim path is leaking 'assigned' rows and needs
              MANUAL operator attention: cross-check pool_items.assigned_at against the
              platform resources table (anti-join in a service that owns BOTH tables)
              to decide whether each stuck row is a true orphan safe to reap or a live
              binding. Source: provisioner/internal/pool/manager.go
              (reportStuckAssigned).

    # instant-provisioner — customer-data drop chokepoint audit (truehomie-db
    # DROP incident, 2026-06-03). Every customer-data destruction the provisioner
    # performs now routes through server.guardedDrop, which emits
    # instant_provisioner_drop_total{resource_type,backend,outcome}. The incident
    # signature was a BURST of un-attributed drops; this alert pages on an
    # abnormal drop rate so the same class is caught in minutes, not via a
    # customer email. Source: provisioner/internal/server/drop_chokepoint.go.
    - name: instant-provisioner-drop-audit
      rules:
        - alert: ProvisionerDropRateAbnormal
          # Baseline drop traffic is the TTL reaper + team-deletion + user DELETE.
          # A sustained rate well above normal is the truehomie burst signature.
          # Tune the threshold against observed steady-state once the metric has
          # baseline history; 0.2/s (≈12/min) sustained 10m is the initial guard.
          expr: |
            sum(rate(instant_provisioner_drop_total{outcome="ok"}[10m])) > 0.2
          for: 10m
          labels:
            severity: warning
            service: provisioner
          annotations:
            summary: "provisioner customer-data drop rate abnormally high (>0.2/s for 10m) — possible mass-deprovision / incident-class burst"
            description: |
              sum(rate(instant_provisioner_drop_total{outcome="ok"}[10m])) > 0.2
              sustained for 10m. The provisioner is dropping customer databases /
              roles / caches / queues at a rate well above the steady-state
              (TTL-reaper + team-deletion + user-DELETE). This is the alertable
              signature of the truehomie-db DROP incident class (a burst of
              un-expected destruction). IMMEDIATE triage: grep the
              instant-provisioner pod logs for `event=provisioner.drop` — every
              sanctioned drop now carries token / provider_resource_id /
              resource_type / caller (gRPC peer) / request_id, so the audit line
              names exactly what was dropped and who asked. Cross-check the count
              against expected reaper/team-deletion volume; an un-attributed or
              unexplained spike is an incident. Source:
              provisioner/internal/server/drop_chokepoint.go (guardedDrop).
        - alert: ProvisionerDropErrors
          expr: |
            sum(rate(instant_provisioner_drop_total{outcome="error"}[15m])) by (resource_type, backend) > 0
          for: 30m
          labels:
            severity: warning
            service: provisioner
          annotations:
            summary: "provisioner drop errors (resource_type={{ $labels.resource_type }} backend={{ $labels.backend }}) for 30m — infra leaking unreclaimed"
            description: |
              instant_provisioner_drop_total{outcome="error"} rate > 0 sustained
              >30m. A backend Deprovision is failing through the chokepoint: the
              customer-data destruction did not complete, so the backing infra
              (DB / role / cache / queue) is leaking unreclaimed. A single blip
              self-heals when the caller (TTL reaper / team-deletion) retries; a
              sustained rate means a backend is wedged. Walk the resource_type /
              backend labels to the targeted backend's /healthz and the
              provisioner's circuit-breaker state. Source:
              provisioner/internal/server/drop_chokepoint.go.

    # instant-worker — continuous-monitoring synthetic flow matrix (PR: flow
    # synthetic runner). The runner (worker/internal/jobs/flow_synthetic.go) runs
    # the P0 flow matrix (healthz / auth_me / provision→reap) against prod every
    # 5 min and emits instant_flow_test_total{flow,actor,tier,layer,result}. The
    # whole layer is INERT until FLOW_SYNTHETIC_ENABLED=true, so these rules never
    # fire until the operator lights the flag (and the metric series exist). NR
    # mirrors: newrelic/alerts/flow-test-*.json + flow-synthetic-leak.json.
    - name: instant-worker-flow-synthetic
      rules:
        - alert: FlowTestP0Fail
          # ANY fail of a P0 user flow (provision, login read, deploy) in prod.
          # 10m window = two consecutive 5-min ticks → unambiguous regression, not
          # flake. P0 page. FACET-equivalent by flow so the responder sees which
          # cell went red; cross-correlate the failing event's commitId attribute
          # (InstantFlowTest) with /healthz .commit_id to name the bad deploy.
          expr: |
            sum(increase(instant_flow_test_total{result="fail"}[10m])) by (flow) > 0
          for: 0m
          labels:
            severity: critical
            service: worker
          annotations:
            summary: "synthetic P0 flow failing in prod — {{ $labels.flow }}"
            description: |
              sum(increase(instant_flow_test_total{result="fail"}[10m])) by (flow) > 0.
              The continuous-monitoring synthetic runner saw a P0 user flow fail twice
              in a row against prod. flow="healthz" → the api itself is down; flow=
              "auth_me" → the authenticated read/JWT-verify path broke; flow=
              "provision_reap" → POST /db/new or the resource delete path broke. Read
              the failing InstantFlowTest event's commitId attribute and compare to
              /healthz .commit_id to name the deploy that introduced the red. Cross-
              correlate the audit_log row (kind=flow_test_failed, actor=
              'system:flow_synthetic') + the slog ERROR line flow_test_failed flow=...
              reason=.... Source: worker/internal/jobs/flow_synthetic.go.
        - alert: FlowTestLatencyRegression
          # P95 of a flow's end-to-end latency over 30m crossing 5s = a 2P
          # latency-regression signal (the per-flow budgets are 1–10s; 5s is a
          # generous platform-wide floor that catches a real slowdown without
          # paging on the provision→reap leg's normal multi-second round-trip).
          expr: |
            histogram_quantile(0.95, sum(rate(instant_flow_test_latency_seconds_bucket[30m])) by (le, flow)) > 5
          for: 10m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "synthetic flow P95 latency regression — {{ $labels.flow }}"
            description: |
              histogram_quantile(0.95, ... by (le, flow)) > 5s over 30m. A synthetic
              flow is correct but slow — a latency regression in the api / provision
              path. Not a page; investigate alongside the api latency dashboards.
              Source: worker/internal/jobs/flow_synthetic.go.
        - alert: FlowTestSilentDeath
          # The synthetic stopped reporting entirely (no series in 15m) WHILE the
          # runner is supposed to be enabled. A monitoring blind spot — the matrix
          # would show stale-green. Only meaningful once the flag is on; absent
          # series before enablement is expected (the `or vector(0)` keeps the
          # rule from firing when the metric has never been observed).
          expr: |
            (sum(increase(instant_flow_test_total[15m])) or vector(0)) == 0
          for: 15m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "synthetic flow runner stopped reporting (silent death)"
            description: |
              No instant_flow_test_total observations in 15m. If FLOW_SYNTHETIC_ENABLED
              is true this is a blind spot — the worker's flow_synthetic job stopped
              ticking (River pool wedged, worker crashloop, or the periodic job
              de-registered). If the flag is OFF this is expected; silence by leaving
              the flag off or scope the rule to the enabled clusters. Source:
              worker/internal/jobs/flow_synthetic.go.
        - alert: FlowSyntheticLeak
          # The rule-24 cleanup ledger breached: a synthetic resource the runner
          # created was NOT reaped (delete path failed) → a real DO/k8s resource is
          # leaking. Must stay 0. P2 (cost + the "never leak resources" promise).
          expr: |
            sum(increase(instant_flow_synthetic_reaped_total{outcome="leaked"}[1h])) > 0
          for: 0m
          labels:
            severity: warning
            service: worker
          annotations:
            summary: "synthetic runner leaked a resource (cleanup-ledger breach)"
            description: |
              instant_flow_synthetic_reaped_total{outcome="leaked"} > 0. A resource the
              synthetic runner provisioned could not be deleted via the real delete
              path — it is leaking on the backing DO/k8s infra. Check the slog ERROR
              line flow_synthetic_leaked (carries resource_id + run_id) and the
              synthetic.reaped audit_log row, then manually deprovision the leaked
              resource. The reaper backstop sweeps orphans older than 30m, so a
              sustained non-zero means even the backstop is failing. Source:
              worker/internal/jobs/flow_synthetic.go (reapResource / reapOrphans).
