# DO NOT commit real values. This is a template for local dev only.
# Generate secrets: make gen-secrets
# Apply: kubectl apply -f k8s/infra-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: instant-infra-secrets
  namespace: instant-infra
type: Opaque
stringData:
  # DATABASE_URL → Azure Database for PostgreSQL Flexible Server, database
  # `instant_platform`. AKS (2026-08-09 DO→Azure port): the previous value
  # pointed at the in-cluster `postgres-platform` Service, which is LOCAL-DEV
  # ONLY and is not deployed on Azure (see k8s/postgres-platform.yaml) — the
  # worker would have silently connected to nothing. Flexible Server requires
  # TLS, so sslmode=require is mandatory. Must match the DATABASE_URL in
  # k8s/secrets.yaml (namespace `instant`) — same database, two namespaces.
  #   postgres://<admin>:<pw>@<server>.postgres.database.azure.com:5432/instant_platform?sslmode=require
  DATABASE_URL: "CHANGE_ME"
  # PROVISIONER_DATABASE_URL → the hot-pool bookkeeping database. AKS port:
  # this is the SECOND database on the SAME Flexible Server, which retires the
  # standalone unbacked Postgres droplet at 161.35.111.84 (GAP-AUDIT R5 SPOF)
  # for $0. Read as `optional: true` by provisioner/deployment.yaml — when
  # empty the provisioner logs `provisioner.pool_disabled` and runs without the
  # hot pool, which is the intended state at POOL_*_SIZE=0.
  #   postgres://<admin>:<pw>@<server>.postgres.database.azure.com:5432/provisioner_db?sslmode=require
  PROVISIONER_DATABASE_URL: "CHANGE_ME"
  # POSTGRES_CUSTOMERS_URL → admin URL the provisioner uses to CREATE/DROP
  # customer databases on the IN-CLUSTER postgres-customers pod. Connects as
  # `instant_cust`; the pg_hba lockdown allows that role only from the pod
  # CIDR, so this MUST be in-cluster Service DNS, never a public host.
  #   postgres://instant_cust:<pw>@postgres-customers.instant-data.svc.cluster.local:5432/instant_customers?sslmode=disable
  POSTGRES_CUSTOMERS_URL: "CHANGE_ME"
  # Generate with: openssl rand -hex 32.
  # MUST be byte-identical to PROVISIONER_SECRET in k8s/secrets.yaml
  # (namespace `instant`) — it is the shared bearer on the api→provisioner gRPC
  # call, so a mismatch fails every provision with an authn error.
  PROVISIONER_SECRET: "change_me_provisioner_secret_32bytes"
  # Generate with: openssl rand -hex 32 (must be exactly 64 hex chars).
  # Placeholder is "CHANGE_ME" (matches k8s/secrets.yaml) — NOT an all-zero
  # hex string: 64 zeros is a syntactically valid AES-256 key, so an
  # accidental `kubectl apply` would silently deploy a trivially-breakable
  # key. "CHANGE_ME" fails the 64-hex-char format check loudly instead.
  # MUST be byte-identical to AES_KEY in k8s/secrets.yaml — the api encrypts
  # connection_url with it and the provisioner/worker decrypt with it.
  AES_KEY: "CHANGE_ME"
  # ── ADDED 2026-08-09 (AKS port) ───────────────────────────────────────────
  # worker/deployment.yaml + provisioner/deployment.yaml reference all of these
  # from `instant-infra-secrets`; they were never in this template. Every one
  # is declared `optional: true` on the Deployment, so their absence does not
  # block startup — it silently disables the feature instead (storage_bytes
  # quota scans read 0; New Relic fails open with a startup warning). Listed
  # here so the template is a complete description of what the namespace needs.
  NEW_RELIC_LICENSE_KEY: "CHANGE_ME"
  # MIGRATOR_SECRET → bearer on the migrator's HTTP control surface. Referenced
  # WITHOUT `optional: true` by migrator/deployment.yaml but never templated
  # here, so the migrator pod sat in CreateContainerConfigError on any fresh
  # cluster. Generate with: openssl rand -hex 32
  MIGRATOR_SECRET: "CHANGE_ME"
  # Mirror of the OBJECT_STORE_* block in k8s/secrets.yaml — same Cloudflare R2
  # bucket + credentials, consumed by the worker/provisioner storage_bytes
  # scanners. Keep the two in sync; a divergence shows up as quota drift, not
  # as an error.
  OBJECT_STORE_BACKEND: "r2"
  OBJECT_STORE_ENDPOINT: "CHANGE_ME"
  OBJECT_STORE_REGION: "auto"
  OBJECT_STORE_ACCESS_KEY: "CHANGE_ME"
  OBJECT_STORE_SECRET_KEY: "CHANGE_ME"
  OBJECT_STORE_BUCKET: "instant-shared"
  OBJECT_STORE_SECURE: "true"
