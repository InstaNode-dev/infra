---
# Redis for provisioning — key-namespaced per customer resource token.
# Distinct from the platform Redis (instant namespace) used by the API/worker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-provision-pvc
  namespace: instant-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # AKS (2026-08-09 DO→Azure port): `local-path` is k3s/Rancher-Desktop only and
  # DOES NOT EXIST on AKS — it would pin this PVC Pending forever. `managed-csi`
  # is the AKS built-in StandardSSD_LRS class. Local dev overrides to
  # `local-path` via an overlay.
  storageClassName: managed-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-provision
  namespace: instant-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-provision
  template:
    metadata:
      labels:
        app: redis-provision
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # AUTH ADDED 2026-08-09 (security forum finding F-3, P0).
          #
          # This pod previously ran with NO --requirepass at all: any pod that
          # could reach port 6379 had full, unauthenticated command access —
          # including FLUSHALL and CONFIG — to the Redis instance backing every
          # customer cache. The AKS port commit edited this file and changed
          # only storageClassName, so it would have shipped that way.
          #
          # `sh -c` is required so $REDIS_PROVISION_PASSWORD expands: a
          # container `command` argv is not shell-processed, so passing
          # `--requirepass $(VAR)` would set the literal string "$(VAR)" as the
          # password — which "works" until something tries to authenticate.
          #
          # Defence in depth, not the only control: data/networkpolicy.yaml
          # restricts ingress to this pod. A NetworkPolicy is one apply away
          # from being absent, and this platform has a documented case of
          # exactly that (POSTGRES-CUSTOMERS-LOCKDOWN-RUNBOOK.md finding L4:
          # a policy written and never applied in prod).
          command:
            - sh
            - -c
            - >-
              exec redis-server
              --requirepass "$REDIS_PROVISION_PASSWORD"
              --maxmemory 256mb
              --maxmemory-policy allkeys-lru
              --appendonly yes
              --dir /data
          env:
            - name: REDIS_PROVISION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: instant-data-secrets
                  key: REDIS_PROVISION_PASSWORD
          # R7 (2026-06-10): requests added so this pod is Burstable, not
          # BestEffort — BestEffort is the FIRST thing evicted under the
          # cluster's memory overcommit. request 128Mi covers idle + small
          # working set; limit 384Mi gives headroom over the --maxmemory 256mb
          # cap (Redis RSS runs above the dataset due to fragmentation + COW on
          # AOF rewrite). cpu request is a floor only (Redis is single-threaded;
          # no cpu limit to avoid throttling latency-sensitive ops).
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              # Must authenticate now that --requirepass is set; a bare
              # `redis-cli ping` returns NOAUTH and the pod never goes Ready.
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PROVISION_PASSWORD" --no-auth-warning ping
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-provision-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-provision
  namespace: instant-data
spec:
  selector:
    app: redis-provision
  ports:
    - port: 6379
      targetPort: 6379
