---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: instant-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # AKS (2026-08-09 DO→Azure port): `local-path` is the k3s/Rancher-Desktop
  # provisioner and DOES NOT EXIST on AKS — leaving it pins this PVC Pending
  # forever with no obvious error. AKS built-in classes are `managed-csi`
  # (StandardSSD_LRS, the cluster default) and `managed-csi-premium`
  # (Premium_LRS). Named explicitly rather than omitted so the class is
  # reviewable in the manifest instead of depending on whichever class the
  # cluster happens to mark default.
  # Local dev (Rancher Desktop / k3s): override to `local-path` via an overlay.
  storageClassName: managed-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: instant-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          # R7 (2026-06-10): requests added so this pod is Burstable, not
          # BestEffort (BestEffort = first evicted under the cluster's memory
          # overcommit). WiredTiger sizes its cache to 50% of (RAM - 1GB) by
          # default; the 1Gi limit keeps that bounded for the free-tier nosql
          # footprint. Bump both if dedicated/Team mongodb lands here.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: root
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
                - --username
                - root
                - --password
                - root
                - --authenticationDatabase
                - admin
                - --quiet
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: instant-data
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# Secret consumed by provisioner deployment as MONGO_ADMIN_URI (added 2026-05-21
# for OSS prep — was previously inlined in provisioner/deployment.yaml).
# Operators MUST replace placeholders. The URI format is:
#   mongodb://<user>:<password>@mongodb.instant-data.svc.cluster.local:27017
# where <user>/<password> match MONGO_INITDB_ROOT_USERNAME/PASSWORD set on
# the mongodb StatefulSet (see the env vars above in this same file once you
# template them).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-admin
  namespace: instant-data
type: Opaque
stringData:
  MONGO_ADMIN_URI: "CHANGE_ME"

