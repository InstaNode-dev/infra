---
# Data-tier ingress NetworkPolicy.
#
# Closes SEC-INFRA FINDING-8 (CWE-668, P3) from /tmp/qa-session/shared/SEC-INBOX.md.
#
# Before this file landed, `k8s/data/{postgres-customers,redis-provision,mongodb,nats}.yaml`
# had NO ingress NetworkPolicy. Ingress was gated only at the *caller* egress
# (provisioner/migrator NetPols). One-way enforcement means any compromised
# in-cluster pod with no egress policy of its own could reach 5432/6379/27017/4222
# directly without traversing the provisioner.
#
# This policy enforces the ingress side: only the four legitimate callers
# may reach each data-tier pod's listening port. Anything else is blocked by
# the default-deny implicit in NetworkPolicy semantics (selecting a pod with
# any policy switches it to deny-by-default for that direction).
#
# Legitimate ingress to instant-data:
#   1. instant-provisioner (instant-infra)   — Provision/Deprovision, StorageBytes
#   2. instant-migrator    (instant-infra)   — CopyData + Verify on resource migrations
#   3. instant-worker      (instant-infra)   — quota_infra storage tick (read-only INFO/dbStats/pg_database_size)
#   4. instant-nats-proxy  (instant)         — only for NATS port 4222 (client-facing fan-out)
#   5. instant-api         (instant)         — postgres-customers 5432 + nats 4222 (ADDED 2026-08-09, see below)
#   6. instant-pg-proxy    (instant)         — postgres-customers 5432, the public customer connect path
#
# NetworkPolicy is additive. If a new caller is added (e.g. dashboard for a
# read-only stat endpoint), add it here AND audit the corresponding egress
# NetPol on the caller side.
#
# ─────────────────────────────────────────────────────────────────────────────
# AKS (2026-08-09 DO→Azure port) — TWO CORRECTNESS FIXES + AN ENFORCEMENT NOTE
# ─────────────────────────────────────────────────────────────────────────────
# (1) `instant-api` was MISSING from the allow lists, and it is a real caller.
#     Verified in the api repo 2026-08-09:
#       - postgres-customers:5432 — `CUSTOMER_DATABASE_URL` is a non-optional env
#         on k8s/app.yaml, and internal/handlers/readyz.go registers a
#         `customer_db` check whenever it is set.
#       - nats:4222 — internal/config/config.go:436 defaults `NATS_HOST` to
#         `nats.instant-data.svc.cluster.local`; k8s/configmap.yaml sets it
#         explicitly. This is the `/queue/new` path.
#     Note the api lives in namespace `instant`, NOT `instant-infra`, so none of
#     the three original instant-infra rules covered it. Applying this policy in
#     its committed form would have default-denied the api and broken
#     /readyz customer_db plus every queue provision — a fresh instance of the
#     same class of bug as the pg-proxy trap below, and the reason this file
#     was never safely applyable.
#
# (2) The `instant-pg-proxy` rule is now ACTIVE, not dormant. Greenfield is the
#     right moment: a `from` selector that matches no pod is inert, so enabling
#     it before the proxy exists costs nothing and removes the documented
#     customer-breaking footgun for whoever deploys the proxy later.
#
# (3) ⚠️ ENFORCEMENT IS NOT AUTOMATIC ON AKS. NetworkPolicy objects are accepted
#     by the API server on ANY cluster, but they are only ENFORCED if a network
#     policy engine is enabled — and on AKS that is a CLUSTER-CREATION-TIME
#     choice (`network_policy` = "cilium" | "azure" | "calico"). With Azure CNI
#     Overlay and no engine, these four policies apply cleanly, `kubectl get
#     networkpolicy` lists them, and they do NOTHING. That is the worst
#     outcome — security theatre that reads as green.
#     REQUIRED TERRAFORM INPUT: network_policy must be set at cluster create.
#     Verify on the live cluster BEFORE trusting this file:
#       az aks show -g <rg> -n <cluster> --query networkProfile.networkPolicy
#       # must print "cilium" (or "azure"/"calico") — NOT null/empty
#     On the retired DO cluster the engine was Cilium (DOKS default).
#
# Apply via: kubectl apply -f k8s/data/networkpolicy.yaml -n instant-data
# (per `infra/k8s/APPLY-CHECKLIST.md`, NEVER `kubectl apply -f infra/k8s/app.yaml`).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-customers-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
    # truehomie-db-drop hardening (2026-06-03): this ingress policy is the
    # NETWORK layer of the admin lockdown. The ADMIN-ROLE layer (rejecting
    # `instant_cust` from the public internet at pg_hba) lives in
    # k8s/data/postgres-customers-lockdown.yaml. See
    # infra/POSTGRES-CUSTOMERS-LOCKDOWN-RUNBOOK.md.
    #
    # RESOLVED 2026-08-09 (AKS port): the pg-proxy rule below is no longer
    # dormant — it is active. Enabling it does NOT widen the admin boundary:
    # pg_hba rejects the admin roles regardless of source, and the proxy only
    # ever forwards customer usr_* roles (it routes by token to db_<token>).
    sec.instanode.dev/incident: truehomie-db-drop-2026-06-03
spec:
  podSelector:
    matchLabels:
      app: postgres-customers
  policyTypes:
    - Ingress
  ingress:
    - from:
        # provisioner — Provision/Deprovision + StorageBytes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        # migrator — CopyData + Verify on resource migrations
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        # worker — quota_infra storage tick (pg_database_size reads)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
        # ── instant-api (ns `instant`) — ADDED 2026-08-09, see header note (1).
        # CUSTOMER_DATABASE_URL / readyz customer_db check. Omitting this
        # default-denies the api and breaks /readyz + customer-DB reads.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant
          podSelector:
            matchLabels:
              app: instant-api
        # ── instant-pg-proxy (customer connect path) — ACTIVE since 2026-08-09.
        # pg.instanode.dev → Azure Standard LB → ingress-nginx tcp-services →
        # instant-pg-proxy (ns `instant`) → here. Without this rule an enforced
        # policy default-denies the proxy and BREAKS EVERY CUSTOMER POSTGRES
        # CONNECTION — the single highest-blast-radius line in this file.
        # The proxy forwards ONLY customer usr_* roles (token-routed); the admin
        # roles are rejected at pg_hba regardless of source, so this does NOT
        # widen admin exposure.
        # ⚠️ The proxy's manifest lives in the SEPARATE InstaNode-dev/instant-pg-proxy
        # repo, not here. The ns/labels below are the documented convention; if
        # the proxy ever ships with different labels this rule silently stops
        # matching and customers break. Confirm against the live cluster after
        # deploying it: kubectl get pods -A -l app=instant-pg-proxy -o wide
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant
          podSelector:
            matchLabels:
              app: instant-pg-proxy
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-provision-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
spec:
  podSelector:
    matchLabels:
      app: redis-provision
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
      ports:
        - port: 27017
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
    - Ingress
  ingress:
    # NATS client port 4222 — accessible to provisioner, worker, AND
    # the instant-nats-proxy (the only legitimate client-facing fan-out
    # path; sits in `instant` namespace).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant
          podSelector:
            matchLabels:
              app: instant-nats-proxy
        # instant-api (ns `instant`) — ADDED 2026-08-09, see header note (1).
        # NATS_HOST defaults to nats.instant-data.svc.cluster.local
        # (api/internal/config/config.go:436) and k8s/configmap.yaml sets it
        # explicitly. This is the /queue/new provisioning path; omitting it
        # default-denies the api and every queue provision fails.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant
          podSelector:
            matchLabels:
              app: instant-api
      ports:
        - port: 4222
          protocol: TCP
    # NATS monitoring port 8222 — only worker's real_prober probes here.
    # (provisioner does not hit this port.)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
      ports:
        - port: 8222
          protocol: TCP
