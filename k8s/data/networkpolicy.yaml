---
# Data-tier ingress NetworkPolicy.
#
# Closes SEC-INFRA FINDING-8 (CWE-668, P3) from /tmp/qa-session/shared/SEC-INBOX.md.
#
# Before this file landed, `k8s/data/{postgres-customers,redis-provision,mongodb,nats}.yaml`
# had NO ingress NetworkPolicy. Ingress was gated only at the *caller* egress
# (provisioner/migrator NetPols). One-way enforcement means any compromised
# in-cluster pod with no egress policy of its own could reach 5432/6379/27017/4222
# directly without traversing the provisioner.
#
# This policy enforces the ingress side: only the four legitimate callers
# may reach each data-tier pod's listening port. Anything else is blocked by
# the default-deny implicit in NetworkPolicy semantics (selecting a pod with
# any policy switches it to deny-by-default for that direction).
#
# Legitimate ingress to instant-data:
#   1. instant-provisioner (instant-infra)   — Provision/Deprovision, StorageBytes
#   2. instant-migrator    (instant-infra)   — CopyData + Verify on resource migrations
#   3. instant-worker      (instant-infra)   — quota_infra storage tick (read-only INFO/dbStats/pg_database_size)
#   4. instant-nats-proxy  (instant)         — only for NATS port 4222 (client-facing fan-out)
#
# NetworkPolicy is additive. If a new caller is added (e.g. dashboard for a
# read-only stat endpoint), add it here AND audit the corresponding egress
# NetPol on the caller side.
#
# Apply via: kubectl apply -f k8s/data/networkpolicy.yaml -n instant-data
# (per `infra/k8s/APPLY-CHECKLIST.md`, NEVER `kubectl apply -f infra/k8s/app.yaml`).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-customers-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
    # truehomie-db-drop hardening (2026-06-03): this ingress policy is the
    # NETWORK layer of the admin lockdown. The ADMIN-ROLE layer (rejecting
    # `instant_cust` from the public internet at pg_hba) lives in
    # k8s/data/postgres-customers-lockdown.yaml. See
    # infra/POSTGRES-CUSTOMERS-LOCKDOWN-RUNBOOK.md.
    #
    # CAVEAT — this policy does NOT list instant-pg-proxy. If the public
    # customer connect path (pg.instanode.dev → ingress-nginx tcp-services →
    # instant-pg-proxy → here) is in-cluster and this policy is enforced,
    # customer connections through the proxy are BLOCKED unless the proxy's
    # source is added below. As of 2026-06-06 the prod-apply state of THIS
    # policy is unverified (infra has no auto-apply). The operator MUST verify
    # in a maintenance window whether customers reach their db_<token>:
    #   - if customer connectivity depends on the proxy AND this policy is
    #     enforced, enable the dormant pg-proxy rule below;
    #   - the admin boundary does NOT depend on this rule — pg_hba rejects the
    #     admin role regardless of source, so enabling the proxy rule does NOT
    #     re-open admin (the proxy only ever forwards customer usr_* roles).
    sec.instanode.dev/incident: truehomie-db-drop-2026-06-03
spec:
  podSelector:
    matchLabels:
      app: postgres-customers
  policyTypes:
    - Ingress
  ingress:
    - from:
        # provisioner — Provision/Deprovision + StorageBytes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        # migrator — CopyData + Verify on resource migrations
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        # worker — quota_infra storage tick (pg_database_size reads)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
        # ── DORMANT: instant-pg-proxy (customer connect path) ────────────────
        # Enable ONLY if the operator confirms in a maintenance window that
        # customers reach their db_<token> THROUGH an in-cluster pg-proxy AND
        # this NetworkPolicy is enforced (otherwise this is a no-op or, worse,
        # silently the thing that has been blocking customers). The proxy
        # forwards ONLY customer usr_* roles (token-routed); the admin role is
        # still rejected at pg_hba, so this does NOT widen admin exposure.
        # Adjust namespace/podSelector to match the real proxy deployment in
        # the InstaNode-dev/instant-pg-proxy repo (its manifest is NOT in this
        # repo). Example (verify the actual ns/labels before enabling):
        # - namespaceSelector:
        #     matchLabels:
        #       kubernetes.io/metadata.name: instant
        #   podSelector:
        #     matchLabels:
        #       app: instant-pg-proxy
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-provision-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
spec:
  podSelector:
    matchLabels:
      app: redis-provision
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-worker
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: instant-data
  labels:
    app.kubernetes.io/component: data
    app.kubernetes.io/managed-by: instant-infra
  annotations:
    sec.instanode.dev/finding: SEC-INFRA-FINDING-8
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-provisioner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
          podSelector:
            matchLabels:
              app: instant-migrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: instant-infra
