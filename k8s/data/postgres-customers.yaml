---
# Customer Postgres — provisioned db_{token} databases live here (Phase 2+)
# Isolated from platform DB: compromise of customer data never touches metadata.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-customers-pvc
  namespace: instant-data
spec:
  accessModes: [ReadWriteOnce]
  # AKS (2026-08-09 DO→Azure port): named explicitly instead of relying on the
  # cluster default. `managed-csi` = AKS built-in StandardSSD_LRS (Azure Disk,
  # RWO single-attach — hence strategy.type: Recreate below). This volume holds
  # EVERY customer db_<token>; naming the class here makes an accidental
  # default-class change a reviewable diff rather than a silent re-provision.
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-customers
  namespace: instant-data
spec:
  replicas: 1
  # Recreate (NOT RollingUpdate): the PVC is ReadWriteOnce, so a rolling update
  # deadlocks on a Multi-Attach error (new pod can't attach the volume while the
  # old pod still holds it on another node). Recreate terminates the old pod
  # first → brief downtime, acceptable for a single-replica stateful workload.
  # (truehomie admin-lockdown apply 2026-06-06 hit + fixed this.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-customers
  template:
    metadata:
      labels:
        app: postgres-customers
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          # truehomie-db-drop admin lockdown (2026-06-03 → applied 2026-06-06):
          # start postgres with the custom pg_hba (mounted below) that rejects the
          # admin superuser roles (instanode_admin/instant_cust) from the public
          # pg-proxy path while preserving the in-cluster admin + customer usr_*
          # paths. See k8s/data/postgres-customers-lockdown.yaml +
          # POSTGRES-CUSTOMERS-LOCKDOWN-RUNBOOK.md.
          args:
            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"
            - "-c"
            - "password_encryption=scram-sha-256"
          ports:
            - containerPort: 5432
          # R7 (2026-06-10): requests added so this pod is Burstable, not
          # BestEffort. postgres-customers holds EVERY customer db_<token> —
          # evicting it first under memory pressure (BestEffort QoS) is the
          # worst possible eviction order. request 256Mi covers shared_buffers
          # + idle backends for the free-tier footprint; limit 1Gi bounds it
          # while leaving room for connection-heavy load. Pair with the
          # instant-data-critical PriorityClass (applied via
          # DATA-TIER-APPLY-RUNBOOK.md) so it is also scheduled ahead of and
          # preempted after stateless app pods.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          env:
            - name: POSTGRES_DB
              value: instant_customers
            - name: POSTGRES_USER
              value: instant_cust
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: instant-data-secrets
                  key: CUSTOMER_DB_PASSWORD
            # PGDATA IN A SUBDIRECTORY (added 2026-08-09, AKS port).
            #
            # Found by the first apply on AKS, not by review — postgres-customers
            # went CrashLoopBackOff with:
            #
            #   initdb: error: directory "/var/lib/postgresql/data" exists but
            #           is not empty
            #   initdb: detail: It contains a lost+found directory, perhaps due
            #           to it being a mount point.
            #
            # Azure managed-csi formats volumes as ext4, which creates a
            # lost+found at the filesystem root. The volume is mounted directly
            # at /var/lib/postgresql/data, so initdb sees a non-empty directory
            # and refuses to initialise. This is a REAL DO->Azure portability
            # difference: the DigitalOcean CSI volumes this manifest was written
            # against did not surface lost+found the same way, so the manifest
            # worked there and fails here.
            #
            # Pointing PGDATA at a subdirectory of the mount is the documented
            # fix and is also what the postgres image's own hint recommends.
            # It costs nothing and is correct on every CSI driver.
            #
            # NOTE this only works on a FRESH volume. Repointing PGDATA on a
            # volume that already holds a cluster at the mount root would
            # silently initialise a second, empty database and appear to
            # succeed. There is no data here (greenfield, zero customers), so
            # it is safe now — it would not be later.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
            # Admin-lockdown pg_hba (ConfigMap postgres-customers-hba). subPath
            # mounts just the single file so PGDATA is untouched.
            - name: hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "instant_cust", "-d", "instant_customers"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-customers-pvc
        - name: hba
          configMap:
            name: postgres-customers-hba
            items:
              - key: pg_hba.conf
                path: pg_hba.conf
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-customers
  namespace: instant-data
spec:
  selector:
    app: postgres-customers
  ports:
    - port: 5432
      targetPort: 5432
