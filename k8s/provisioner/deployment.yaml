---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instant-provisioner
  namespace: instant-infra
  labels:
    app: instant-provisioner
    # instanode.dev/image-pinned — informational. Set to "true" when the
    # running image tag matches v\d+\.\d+\.\d+.* AND has been pinned by
    # .github/workflows/pin-prod-images.yml. See
    # docs/IMAGE-RETENTION-POLICY.md.
    instanode.dev/image-pinned: "true"
  annotations:
    instanode.dev/image-pin-retention-days: "730"
spec:
  # AKS (2026-08-09 DO→Azure port): 2 → 1.
  # The Azure footprint is a SINGLE Standard_B2as_v2 system node (autoscale
  # 1→3, but 1 at rest). Two replicas on one node share a fate domain — they
  # buy zero availability and cost a second copy of the RAM. The podAntiAffinity
  # below is `preferred`, so on a 1-node cluster both pods land on that node
  # anyway. Scale back to 2 the moment a second node is permanently present.
  replicas: 1
  selector:
    matchLabels:
      app: instant-provisioner
  template:
    metadata:
      labels:
        app: instant-provisioner
    spec:
      # ServiceAccount grants ClusterRole permissions for k8s dedicated backend.
      # When K8S_DEDICATED_BACKEND=false (default), the SA is still present but unused.
      serviceAccountName: instant-provisioner
      # Spread replicas across nodes so node loss doesn't take all gRPC handlers down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: instant-provisioner
                topologyKey: kubernetes.io/hostname
      # imagePullSecrets — required to pull the prod image from GHCR org
      # `instanode-dev`. Codified 2026-05-20 after a near-miss where a
      # `kubectl apply -f provisioner/deployment.yaml` would have stripped
      # them and left every new pod in ImagePullBackOff. See APPLY-CHECKLIST.md.
      imagePullSecrets:
        - name: ghcr-pull
        - name: ghcr-regrade
      # terminationGracePeriodSeconds — default 30s. Codified so a future
      # bump doesn't silently shrink the budget.
      terminationGracePeriodSeconds: 30
      # NOTE — wait-for-provisioner-db initContainer intentionally absent.
      # Prod runs against EXTERNAL managed Postgres (the postgres-provisioner
      # Service does not exist in `instant-infra`), and
      # PROVISIONER_DATABASE_URL is the actual source-of-truth env var.
      # AKS (2026-08-09): that URL now points at `provisioner_db`, a SECOND
      # database on the SAME Azure Flexible Server as instant_platform — which
      # retires the standalone unbacked Postgres droplet at 161.35.111.84
      # (GAP-AUDIT R5 SPOF) for $0.
      # For local dev that does run an in-cluster postgres-provisioner pod,
      # use the local-dev overlay alongside this file. See APPLY-CHECKLIST.md.
      containers:
        - name: provisioner
          # Placeholder image — the auto-deploy CI (provisioner repo's
          # .github/workflows/deploy.yml) overrides this via
          # `kubectl set image deploy/instant-provisioner provisioner=ghcr.io/instanode-dev/instant-provisioner:master-<sha>`
          # on every push to master. See APPLY-CHECKLIST.md.
          image: ghcr.io/instanode-dev/instant-provisioner:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
            # /healthz sidecar exposed by track 5 (obs-3-provisioner). Used
            # by the Service below for HTTP health probes from Prometheus
            # and Kubernetes-native readiness.
            - containerPort: 8092
              name: healthz
          env:
            # ── Observability (track 6 of 8) ──────────────────────────────────
            # NEW_RELIC_LICENSE_KEY pulled from instant-infra-secrets. When
            # empty or CHANGE_ME, the Go newrelic agent fails open and logs
            # a warning every startup — never crashes.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
            - name: NEW_RELIC_APP_NAME
              value: "instant-provisioner"
            # New Relic OTLP gRPC endpoint (US data center). Use
            # https://otlp.eu01.nr-data.net:4317 for EU accounts.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net:4317"
            - name: OTEL_SERVICE_NAME
              value: "instant-provisioner"
            # VERSION overrides the -ldflags-baked default at runtime. Bump
            # per release, or leave as "dev" to rely on the buildinfo SHA
            # baked into the image.
            - name: VERSION
              value: "dev"
            - name: PROVISIONER_PORT
              value: "50051"
            # ── Backend selection — SHARED, not dedicated ─────────────────────
            # "local" = the shared data tier in `instant-data`
            # (postgres-customers / redis-provision / mongodb / nats). "k8s" =
            # a DEDICATED pod-per-resource in its own `instant-customer-<token>`
            # namespace, which the code applies to EVERY tier, not just Team
            # (provisioner/internal/backend/postgres/backend.go:83).
            #
            # CORRECTED 2026-08-12 on the AKS greenfield bring-up. These four
            # keys shipped as "k8s", which does not match what DO prod actually
            # ran (194 customer databases lived on the single shared
            # postgres-customers pod) and does not match the product: dedicated
            # infrastructure is a Team-tier promise, and Team is not rolled out.
            # Verified live before changing: one anonymous `POST /db/new`
            # created namespace instant-customer-<token> with a whole Postgres
            # Deployment + NodePort Service and NO row in instant_customers.
            #
            # On this node the dedicated path is also physically capped:
            # Standard_B2as_v2 allows maxDataDisks=4 and the data tier already
            # binds all four (postgres-customers, redis-provision, mongodb,
            # nats-jetstream). Anonymous tenants get no PVC so they merely eat
            # RAM, but the first PVC-backed paid tenant would hang Pending
            # forever — the silent first-paying-customer failure the migration
            # plan called out in §6.1. Re-enabling dedicated needs a larger SKU.
            - name: POSTGRES_PROVISION_BACKEND
              value: "local"
            # POSTGRES_CUSTOMERS_URL is the admin URL the provisioner uses
            # to CREATE/DROP customer databases on shared Postgres. The real
            # password lives in instant-infra-secrets — sourcing it here so
            # this manifest never carries the production password.
            - name: POSTGRES_CUSTOMERS_URL
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: POSTGRES_CUSTOMERS_URL
                  optional: true
            # See the POSTGRES_PROVISION_BACKEND block above for why this is
            # "local" (shared redis-provision) rather than a pod per tenant.
            - name: REDIS_PROVISION_BACKEND
              value: "local"
            - name: REDIS_PROVISION_HOST
              value: "redis-provision.instant-data.svc.cluster.local:6379"
            # MONGO_ADMIN_URI was historically inlined here as
            # `mongodb://root:root@...` for local-dev convenience. For OSS
            # publication it is sourced from a Secret so the manifest contains
            # no credentials. Operators MUST create the secret before applying;
            # see infra/k8s/data/mongodb.yaml for the matching Secret template.
            - name: MONGO_ADMIN_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-admin
                  key: MONGO_ADMIN_URI
            - name: MONGO_HOST
              value: "mongodb.instant-data.svc.cluster.local:27017"
            - name: PROVISIONER_SECRET
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: PROVISIONER_SECRET
            # Hot-pool configuration.
            # PROVISIONER_DATABASE_URL is optional: provisioner/main.go logs
            # "provisioner.pool_disabled" and runs without the hot-pool when
            # the value is empty or the key is missing from the secret.
            # Marked optional:true after B2 incident (2026-05-12): `kubectl
            # apply -f infra-secrets.yaml` had dropped a previously-patched
            # key from the in-cluster Secret, leaving new provisioner pods
            # stuck in CreateContainerConfigError. The secret YAML never
            # carried this key, so making the deployment tolerant of its
            # absence is the cleanest fix.
            - name: PROVISIONER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: PROVISIONER_DATABASE_URL
                  optional: true
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: AES_KEY
            # ── Hot-pool targets ──────────────────────────────────────────────
            # HISTORY: raised 2/3/2 -> 10 (and POOL_QUEUE_SIZE added) on the DO
            # 5-node pool to fix load-test finding F1 — the provisioning latency
            # cliff. 10 ready items absorbed a concurrency-8 burst entirely on
            # the fast pool-claim path instead of falling through to slow live
            # provisioning.
            #
            # AKS (2026-08-09 DO→Azure port): 10 → 0 on all four.
            # The Azure footprint is ONE Standard_B2as_v2 (2 vCPU / 8 GiB,
            # ~1.9 vCPU / ~5.5 GiB allocatable). Each pre-warmed item is a real
            # pod: at 10 apiece that is up to 40 pods holding roughly 4 × 10 ×
            # (100m / 256Mi) ≈ 4 vCPU / 10 GiB of requests — MORE than the whole
            # node, so the provisioner would sit in a permanent Pending-pod loop
            # and starve the platform services it shares the node with.
            # The migration is greenfield with ZERO customers, so there is
            # nothing to pre-warm FOR: the pool exists to hide provisioning
            # latency under burst, and there is no burst.
            #
            # 0 disables pre-warming; every provision takes the live path (the
            # pre-F1 behaviour, ~seconds). Raise to 1–2 per service on the FIRST
            # real signal (p95 provision latency, or a customer complaint), and
            # only past that once a second node exists. Must stay >= 0 and
            # <= whatever the node can actually hold — this is a capacity knob,
            # not a correctness one.
            - name: POOL_POSTGRES_SIZE
              value: "0"
            - name: POOL_REDIS_SIZE
              value: "0"
            - name: POOL_MONGO_SIZE
              value: "0"
            - name: POOL_QUEUE_SIZE
              value: "0"
            # ── Kubernetes dedicated backend (Team tier) ──────────────────────
            # See docs/ops-k8s-dedicated.md for the full EKS deployment guide.
            #
            # OFF as of 2026-08-12 (AKS greenfield). Team tier is not rolled
            # out, and the single Standard_B2as_v2 node has zero spare data
            # disks for per-tenant PVCs — see the POSTGRES_PROVISION_BACKEND
            # block above. Flip back to "true" together with the four
            # *_PROVISION_BACKEND keys, on a SKU with disk headroom.
            - name: K8S_DEDICATED_BACKEND
              value: "false"
            # K8S_EXTERNAL_HOST is the public-DNS host the provisioner stamps
            # into customer connection URLs that get routed in via TCP-router
            # (pg.instanode.dev → ingress-nginx tcp-services-configmap →
            # tenant Service). For local dev, override to 127.0.0.1 via an
            # overlay (Rancher Desktop NodePorts).
            - name: K8S_EXTERNAL_HOST
              value: "pg.instanode.dev"
            # K8S_STORAGE_CLASS — the StorageClass the provisioner stamps onto
            # every PVC it creates for a DEDICATED per-tenant DB pod
            # (K8S_DEDICATED_BACKEND=true above). This is the ONE cloud-coupled
            # value in this file; it must match a StorageClass that exists on
            # the cluster or every dedicated provision hangs with the tenant PVC
            # stuck Pending (the failure is silent from the API's side).
            #
            #   AKS   → managed-csi          (built-in StandardSSD_LRS)  ← prod
            #   AKS   → managed-csi-premium  (built-in Premium_LRS)
            #   DOKS  → do-block-storage     (retired 2026-08-09)
            #   k3s   → local-path           (local dev, via overlay)
            #
            # Verify on a new cluster with: kubectl get storageclass
            - name: K8S_STORAGE_CLASS
              value: "managed-csi"
            - name: K8S_POSTGRES_IMAGE
              value: "pgvector/pgvector:pg16"  # includes pgvector so pg_restore can restore vector extension
            - name: K8S_REDIS_IMAGE
              value: "redis:7-alpine"
            - name: K8S_MONGO_IMAGE
              value: "mongo:7"
            - name: K8S_NATS_IMAGE
              value: "nats:2.10-alpine"
            - name: NATS_HOST
              value: "nats.instant-data.svc.cluster.local"
            - name: K8S_POSTGRES_STORAGE_GI
              value: "1"            # small for local dev (saves disk)
            - name: K8S_REDIS_STORAGE_GI
              value: "1"
            - name: K8S_MONGO_STORAGE_GI
              value: "1"
            # ── Object-storage bytes queries ──────────────────────────────────
            # Migrated 2026-05-20 from MINIO_* to OBJECT_STORE_* as part of
            # chore/retire-self-hosted-minio-2026-05-20 (supersedes PR #4).
            # Self-hosted MinIO retired; DO Spaces is the canonical backend.
            # Also removes a previously dangling reference to a `minio-secrets`
            # Secret in the instant-infra namespace that was never defined in
            # the tree (the in-repo Secret lived in instant-data).
            - name: OBJECT_STORE_BACKEND
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_BACKEND
                  optional: true
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_ENDPOINT
                  optional: true
            - name: OBJECT_STORE_REGION
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_REGION
                  optional: true
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_ACCESS_KEY
                  optional: true
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_SECRET_KEY
                  optional: true
            - name: OBJECT_STORE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_BUCKET
                  optional: true
            - name: OBJECT_STORE_SECURE
              valueFrom:
                secretKeyRef:
                  name: instant-infra-secrets
                  key: OBJECT_STORE_SECURE
                  optional: true
            # ── OTLP headers (NR license key) — CODIFIED INTENT ───────────────
            # The live deployment has this as an inline `value:` literal (NR
            # license key embedded). Codified intent is to pull from
            # instant-infra-secrets. Until an operator runs the one-time
            # reconciliation (remove the live inline-value entry first), this
            # stays commented out — see APPLY-CHECKLIST.md for the procedure.
            #
            # - name: OTEL_EXPORTER_OTLP_HEADERS
            #   valueFrom:
            #     secretKeyRef:
            #       name: instant-infra-secrets
            #       key: OTEL_EXPORTER_OTLP_HEADERS
            #       optional: true
            # ── Mongo / Queue backend selection ───────────────────────────────
            # "local" = the shared mongodb / nats pods in `instant-data`.
            # Corrected from "k8s" 2026-08-12 for the same reason as
            # POSTGRES_PROVISION_BACKEND above — dedicated pod-per-tenant is a
            # Team-tier promise that is not rolled out and does not fit this
            # node. The stale comment this replaces claimed the postgres/redis
            # defaults above were "local" while they were in fact set to "k8s".
            - name: MONGO_PROVISION_BACKEND
              value: "local"
            - name: QUEUE_PROVISION_BACKEND
              value: "local"
            # ── Public hostnames for issued connection URLs ───────────────────
            # The provisioner builds the host portion of `connection_url` for
            # customer-facing tokens from these. In local dev they default to
            # 127.0.0.1; in prod they MUST point at the public TCP-router DNS
            # (pg.instanode.dev / redis.instanode.dev / mongo.instanode.dev).
            # Codifying as env defaults so a fresh deploy still issues URLs
            # the customer can reach.
            - name: POSTGRES_PUBLIC_HOST
              value: "pg.instanode.dev"
            - name: POSTGRES_PUBLIC_PORT
              value: "5432"
            - name: REDIS_PUBLIC_HOST
              value: "redis.instanode.dev"
            - name: REDIS_PUBLIC_PORT
              value: "6379"
            - name: K8S_MONGO_PUBLIC_HOST
              value: "mongo.instanode.dev"
            # ── Shared-cluster Redis URL the provisioner injects into routes ──
            - name: REDIS_URL_FOR_ROUTES
              value: "redis://redis.instant.svc.cluster.local:6379"
          # Probes (2026-05-18): the provisioner's /healthz sidecar on port
          # 8092 registers ONLY /healthz — it never serves /livez. All three
          # probes hit /healthz (checks DB + pool init). The generous
          # startupProbe budget (10 min) absorbs hot-pool pre-creation before
          # the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8092
            periodSeconds: 10
            failureThreshold: 60     # 10 min total — covers hot-pool pre-creation
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz        # provisioner serves only /healthz (no /livez)
              port: 8092
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6      # 6 × 30s = 3 min before SIGKILL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
