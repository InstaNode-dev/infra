apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-puller
  namespace: kube-system
  labels:
    app: image-puller
spec:
  selector:
    matchLabels:
      app: image-puller
  template:
    metadata:
      labels:
        app: image-puller
    spec:
      # AKS (2026-08-09 DO→Azure port): the blanket `tolerations: [{operator:
      # Exists}]` was REMOVED.
      #
      # It tolerated EVERY taint, so on Azure this DaemonSet would land on the
      # scale-to-zero Spot pool and pull ~1.5 GiB of database images
      # (pgvector/pgvector:pg16 + mongo:7 + redis + nats) onto every Spot node
      # the moment the autoscaler brought one up. The Spot pool exists to run
      # Kaniko builds and customer deploy pods — neither uses these images — so
      # every scale-up would pay a multi-minute image pull and egress bill for
      # a cache that is never read, and it would delay the build the node was
      # created for.
      #
      # The DaemonSet now runs ONLY on the system pool, which is where the
      # provisioner actually schedules dedicated per-tenant DB pods.
      # `kubernetes.azure.com/scalesetpriority` is set to "spot" by AKS on every
      # Spot node and is ABSENT on regular nodes, so DoesNotExist selects
      # exactly the regular pool without hardcoding a pool name.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.azure.com/scalesetpriority
                    operator: DoesNotExist
      # Still tolerate the control-plane taint so the puller covers any future
      # schedulable system node; deliberately NOT a blanket Exists.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      automountServiceAccountToken: false
      # initContainers run in order, each must succeed before the next. Each
      # one's `:` command exits instantly — the only work is the image pull,
      # which warms the node's containerd image cache. Once the main `pause`
      # container is running and referencing nothing, kubelet GC won't reap
      # these images because they're recent and disk pressure is low.
      initContainers:
        - name: pull-postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
        - name: pull-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
        - name: pull-mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
        - name: pull-nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 1m,  memory: 8Mi }
            limits:   { cpu: 10m, memory: 16Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
