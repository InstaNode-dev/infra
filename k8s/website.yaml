---
# ConfigMap: controls which API URLs are embedded in the website
# LOCAL (default): points to the API running in k8s (via ClusterIP)
# PRODUCTION: set API_BASE_URL=https://instant.dev before applying
apiVersion: v1
kind: ConfigMap
metadata:
  name: instant-website-config
  namespace: instant
data:
  # Override this for production: https://api.instanode.dev
  # For local k8s (Rancher Desktop / minikube): port-forward the API:
  #   kubectl port-forward -n instant svc/instant-api 8080:8080
  # NOTE: the legacy NodePort 30080 was retired 2026-05-11 — instant-api
  # Service is now ClusterIP only (see app.yaml). Older ConfigMap values
  # of http://localhost:30080 will fail to connect after re-apply.
  API_BASE_URL: "http://localhost:8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instant-website
  namespace: instant
  labels:
    app: instant-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instant-website
  template:
    metadata:
      labels:
        app: instant-website
    spec:
      containers:
        - name: website
          image: instant-website:local   # build with: docker build -t instant-website:local website/
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: instant-website-config
                  key: API_BASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: instant-website
  namespace: instant
spec:
  # AKS (2026-08-09 DO→Azure port): NodePort 30081 → ClusterIP.
  # The public marketing site is served from GitHub Pages behind Cloudflare and
  # is NOT this workload (verified in the migration plan §1 — instanode.dev
  # resolves to Cloudflare, not the cluster LB), so nothing external needs a
  # node port here. Matches the NodePort retirement already applied to
  # instant-api on 2026-05-11.
  # For local dev: kubectl port-forward -n instant svc/instant-website 8081:80
  type: ClusterIP
  selector:
    app: instant-website
  ports:
    - port: 80
      targetPort: 80
