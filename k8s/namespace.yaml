apiVersion: v1
kind: Namespace
metadata:
  name: instant
---
apiVersion: v1
kind: Namespace
metadata:
  name: instant-infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: instant-data
---
# ADDED 2026-08-09 (AKS port) — instant-apps.
# `KUBE_NAMESPACE_APPS: "instant-apps"` has been in k8s/configmap.yaml and
# k8s/worker/deployment.yaml since the deploy wedge shipped, but the namespace
# was never declared anywhere in this repo — it only ever existed because
# someone created it by hand on the DO cluster. On a greenfield cluster its
# absence is a silent deploy failure. Declared here so `apply-all.sh` brings up
# a working cluster with no hand steps.
# (The per-deploy `instant-deploy-*` / `instant-stack-*` namespaces are created
# at request time by the api and are correctly NOT declared here.)
apiVersion: v1
kind: Namespace
metadata:
  name: instant-apps
---
# ADDED 2026-08-09 (AKS port) — newrelic.
# k8s/newrelic-prometheus-agent.yaml puts its ServiceAccount, ConfigMap,
# Deployment and Secret in namespace `newrelic` but never creates it, so
# applying that file against a clean cluster fails with
# `namespaces "newrelic" not found`. Without the agent every `FROM Metric`
# New Relic alert is inert (memory: project_nr_metric_alerts_inert_no_prom_pipeline).
apiVersion: v1
kind: Namespace
metadata:
  name: newrelic
